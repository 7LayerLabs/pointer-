<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeDeck Studio</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: block; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; font-display: block; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }

:root {
  --bg: #121110; --side: #161513; --surf: #1c1a18; --raised: #23211e; --hover: #282521;
  --line: #2a2724; --line2: #36322d;
  --tx: #ece7df; --tx2: #b9b2a7; --tx3: #857e74; --tx4: #5f5952;
  --y: #ffd400; --yd: rgba(255, 212, 0, .14);
  --add: #8fbf8a; --addbg: rgba(143, 191, 138, .12); --addbg2: rgba(143, 191, 138, .2);
  --del: #d98b7a; --delbg: rgba(217, 139, 122, .12); --delbg2: rgba(217, 139, 122, .2);
  --mod: #d9b36c;
  --r1: 6px; --r2: 8px; --r3: 10px; --r4: 12px;
  --sh: 0 1px 0 rgba(255,255,255,.03) inset, 0 18px 50px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.3);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sbw: 264px; --dockw: 384px;
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (max-width: 1360px) { :root { --sbw: 240px; --dockw: 348px; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--tx); }
body { font: 14px/1.55 var(--ui); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s14 { width: 14px; height: 14px; }
svg.i.s18 { width: 18px; height: 18px; }
svg.i.s20 { width: 20px; height: 20px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid rgba(255, 212, 0, .6); outline-offset: 1px; border-radius: var(--r1); }
input:focus-visible, textarea:focus-visible { outline: none; }
[hidden] { display: none !important; }
::selection { background: rgba(255, 212, 0, .22); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2f2b27; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #3d3833; background-clip: padding-box; border: 3px solid transparent; }
::-webkit-scrollbar-corner { background: transparent; }
.kbd { font: 500 11px/1 var(--mono); color: var(--tx3); background: var(--raised); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px 2px; white-space: nowrap; }
.mono { font-family: var(--mono); }

/* ---------- app frame ---------- */
#app { height: 100vh; display: grid; grid-template-rows: 44px 1fr 26px; }

.titlebar { position: relative; display: flex; align-items: center; background: var(--bg); border-bottom: 1px solid var(--line); padding-left: 14px; user-select: none; }
.tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-left .logo { width: 20px; height: 20px; display: block; }
.tb-proj { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tx); font-weight: 550; padding: 4px 8px; border-radius: var(--r2); transition: background .15s; }
.tb-proj:hover { background: var(--surf); }
.tb-proj .sep { color: var(--tx4); font-weight: 400; }
.tb-proj .br { color: var(--tx3); font-weight: 450; display: flex; align-items: center; gap: 5px; }
.cmdfield { position: absolute; left: 50%; top: 7px; transform: translateX(-50%); width: clamp(380px, 38vw, 560px); height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; background: var(--surf); border: 1px solid var(--line2); border-radius: var(--r3); color: var(--tx3); font-size: 13px; transition: border-color .15s, background .15s, box-shadow .15s; }
.cmdfield:hover { border-color: #4a443d; background: #1f1d1a; color: var(--tx2); }
.cmdfield:focus-visible { outline: none; border-color: rgba(255,212,0,.7); box-shadow: 0 0 0 3px rgba(255,212,0,.12); }
.cmdfield .ph { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdfield .kbd { background: var(--raised); }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 100%; }
.agents-pill { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surf); font-size: 12.5px; color: var(--tx2); transition: border-color .15s, background .15s; }
.agents-pill:hover { border-color: #4a443d; color: var(--tx); }
.agents-pill .dots { display: flex; gap: 4px; }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--tx4); display: inline-block; flex: none; }
.sdot.working { background: var(--add); animation: pulse 1.8s var(--ease) infinite; }
.sdot.waiting { background: var(--y); }
.sdot.done { background: var(--tx2); }
.sdot.merged { background: var(--tx4); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(143,191,138,.55); } 70% { box-shadow: 0 0 0 5px rgba(143,191,138,0); } 100% { box-shadow: 0 0 0 0 rgba(143,191,138,0); } }
.iconbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r2); color: var(--tx3); transition: background .15s, color .15s; }
.iconbtn:hover { background: var(--raised); color: var(--tx); }
.iconbtn.on { color: var(--tx); }
.winctl { display: flex; height: 100%; margin-left: 6px; }
.winctl button { width: 44px; height: 100%; display: grid; place-items: center; color: var(--tx3); transition: background .12s, color .12s; }
.winctl button:hover { background: var(--surf); color: var(--tx); }
.winctl button.x:hover { background: #b5503f; color: #fff; }

.main { display: grid; grid-template-columns: 48px var(--sbw) minmax(0, 1fr) var(--dockw); min-height: 0; transition: grid-template-columns .18s var(--ease); }
.main.nosb { grid-template-columns: 48px 0 minmax(0, 1fr) var(--dockw); }
.main.nodock { grid-template-columns: 48px var(--sbw) minmax(0, 1fr) 0; }
.main.nosb.nodock { grid-template-columns: 48px 0 minmax(0, 1fr) 0; }

/* ---------- activity bar ---------- */
.activity { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
.act { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r3); color: var(--tx3); transition: background .15s, color .15s; }
.act:hover { color: var(--tx); background: var(--surf); }
.act.on { color: var(--tx); }
.act.on::before { content: ''; position: absolute; left: -6px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--y); }
.act .badge { position: absolute; top: 4px; right: 3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; font: 650 9.5px/15px var(--ui); text-align: center; background: var(--raised); color: var(--tx2); border: 1px solid var(--line2); }
.act .badge.y { background: var(--y); color: #1a1500; border-color: transparent; }
.activity .spacer { flex: 1; }

/* ---------- sidebar ---------- */
.sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.main.nosb .sidebar { border-right: 0; }
.sb-head { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
.sb-head h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tx3); flex: 1; white-space: nowrap; }
.sb-body { flex: 1; overflow: auto; padding: 0 8px 64px; min-height: 0; }
.sb-sec { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--tx4); padding: 14px 8px 6px; display: flex; align-items: center; gap: 8px; }
.sb-sec .n { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--tx3); font-weight: 500; }

.tr { display: flex; align-items: center; gap: 7px; height: 28px; padding-left: calc(8px + var(--d) * 14px); padding-right: 8px; border-radius: var(--r1); color: var(--tx2); font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; user-select: none; }
.tr:hover { background: var(--surf); color: var(--tx); }
.tr.on { background: var(--raised); color: var(--tx); }
.tr .chev { width: 14px; display: grid; place-items: center; color: var(--tx4); transition: transform .15s var(--ease); }
.tr .chev.open { transform: rotate(90deg); }
.tr .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.tr .st { font: 600 11px/1 var(--mono); width: 14px; text-align: center; }
.st.M { color: var(--mod); } .st.A { color: var(--add); } .st.D { color: var(--del); }
.tr .fdot { width: 5px; height: 5px; border-radius: 50%; background: var(--mod); opacity: .7; margin-right: 4px; }
.tr.heavy { opacity: .42; }
.tr.note { color: var(--tx4); font-size: 12px; cursor: default; font-style: italic; }
.tr.note:hover { background: none; }
.ficon { color: var(--tx3); }
.ficon.ts { color: #8ea9c4; } .ficon.tsx { color: #8ea9c4; } .ficon.css { color: #c49ac0; } .ficon.md { color: #b9b2a7; } .ficon.json { color: #d9b36c; } .ficon.xml { color: #d98b7a; }
.tr .removed-st { margin-left: auto; }

.sb-input { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; margin: 0 8px 8px; background: var(--surf); border: 1px solid var(--line2); border-radius: var(--r2); color: var(--tx3); transition: border-color .15s, box-shadow .15s; }
.sb-input:focus-within { border-color: rgba(255,212,0,.6); box-shadow: 0 0 0 3px rgba(255,212,0,.1); }
.sb-input input { flex: 1; min-width: 0; background: none; border: 0; color: var(--tx); font-size: 13.5px; }
.sb-meta { font-size: 12px; color: var(--tx3); padding: 2px 16px 8px; }
.sr-file { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; border-radius: var(--r1); color: var(--tx); font-size: 13px; cursor: pointer; }
.sr-file:hover { background: var(--surf); }
.sr-file .dir { color: var(--tx4); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.sr-file .cnt { font-size: 11px; color: var(--tx3); background: var(--raised); border-radius: 9px; padding: 0 7px; line-height: 18px; }
.sr-line { display: flex; gap: 10px; padding: 4px 8px 4px 30px; border-radius: var(--r1); font: 12.5px/1.5 var(--mono); color: var(--tx2); cursor: pointer; white-space: nowrap; overflow: hidden; }
.sr-line:hover { background: var(--surf); color: var(--tx); }
.sr-line .ln { color: var(--tx4); min-width: 18px; text-align: right; }
.sr-line .tx { overflow: hidden; text-overflow: ellipsis; }
.sr-line mark { background: rgba(255,212,0,.2); color: var(--tx); border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px rgba(255,212,0,.25); }

/* git */
.commit-box { margin: 0 8px 4px; background: var(--surf); border: 1px solid var(--line2); border-radius: var(--r3); padding: 10px; transition: border-color .15s, box-shadow .15s; }
.commit-box:focus-within { border-color: rgba(255,212,0,.55); box-shadow: 0 0 0 3px rgba(255,212,0,.08); }
.commit-box textarea { width: 100%; background: none; border: 0; resize: none; font-size: 13px; line-height: 1.5; color: var(--tx); height: 58px; display: block; }
.commit-box textarea::placeholder { color: var(--tx4); }
.commit-row { display: flex; gap: 8px; margin-top: 8px; }
.git-row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--r1); font-size: 13px; color: var(--tx2); cursor: pointer; transition: background .12s; }
.git-row:hover { background: var(--surf); color: var(--tx); }
.git-row .nm { color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.git-row .nm.grow { flex: 1; }
.git-row .dir { color: var(--tx4); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.git-row .acts { display: none; gap: 2px; }
.git-row:hover .acts { display: flex; }
.git-row:hover .nums { display: none; }
.git-row .acts button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--tx3); }
.git-row .acts button:hover { background: var(--raised); color: var(--tx); }
.nums { font: 500 11.5px/1 var(--mono); display: flex; gap: 6px; white-space: nowrap; }
.nums .p { color: var(--add); } .nums .m { color: var(--del); }
.empty-note { margin: 6px 8px; padding: 14px; border: 1px dashed var(--line2); border-radius: var(--r3); color: var(--tx3); font-size: 12.5px; text-align: center; }
.cp-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: var(--r1); font-size: 12.5px; color: var(--tx2); cursor: pointer; }
.cp-row:hover { background: var(--surf); }
.cp-row .when { margin-left: auto; color: var(--tx4); white-space: nowrap; }
.cp-row .rail { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--tx3); margin-top: 6px; flex: none; }

/* agents list */
.ag-row { position: relative; display: flex; gap: 11px; padding: 11px 10px 11px 12px; border-radius: var(--r3); cursor: pointer; transition: background .12s; border: 1px solid transparent; margin-bottom: 2px; }
.ag-row:hover { background: var(--surf); }
.ag-row.sel { background: var(--raised); border-color: var(--line2); }
.ag-row .stw { width: 16px; height: 20px; display: grid; place-items: center; flex: none; }
.ag-row .bd { flex: 1; min-width: 0; }
.ag-row .ttl { font-size: 13.5px; font-weight: 550; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-row.st-merged .ttl { color: var(--tx3); }
.ag-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx3); margin-top: 2px; white-space: nowrap; }
.cli-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.ag-foot { display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; margin-top: 7px; font-size: 12px; color: var(--tx3); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 6px; background: rgba(236,231,223,.05); border: 1px solid var(--line2); color: var(--tx3); white-space: nowrap; }
.icon-tag { padding: 0 5px; }
.wait-badge { font-size: 11px; font-weight: 600; line-height: 19px; padding: 0 7px; border-radius: 6px; background: var(--y); color: #1a1500; white-space: nowrap; align-self: flex-start; }
.check-ic { color: var(--tx2); }
.merge-ic { color: var(--tx4); }
.cmp-card { margin: 10px 8px 0; padding: 14px; border-radius: var(--r4); border: 1px solid var(--line2); background: linear-gradient(180deg, var(--surf), var(--side)); }
.cmp-card .t { font-size: 13px; font-weight: 600; }
.cmp-card .d { font-size: 12.5px; color: var(--tx3); margin: 3px 0 10px; }
.cmp-card .clis { display: flex; gap: 5px; margin-bottom: 12px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: var(--r2); font-size: 13px; font-weight: 550; color: var(--tx2); background: var(--raised); border: 1px solid var(--line2); transition: background .15s, color .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover { color: var(--tx); background: var(--hover); border-color: #47413a; }
.btn:active { transform: translateY(.5px); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--raised); }
.btn.primary { background: var(--y); color: #191400; border-color: var(--y); }
.btn.primary:hover { background: #ffe042; border-color: #ffe042; color: #191400; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; border-radius: 7px; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.danger:hover { color: var(--del); }

/* ---------- center / editor ---------- */
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.editors { flex: 1; display: flex; min-height: 0; }
.group { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1; }
.group.ed { container-type: inline-size; }
.lbl .short, .bl-short { display: none; }
@container (max-width: 820px) { .toolbar .by-chip .bt { display: none; } .toolbar .by-chip { padding: 0 7px; } }
@container (max-width: 690px) { .crumbs .pre { display: none; } }
@container (max-width: 600px) { .toolbar .by-chip, .toolbar .tb-sep.s1 { display: none; } }
@container (max-width: 520px) { .toolbar .tbtn .bl { display: none; } .toolbar .tbtn { padding: 0 7px; } .lbl .full { display: none; } .lbl .short { display: inline; } .toolbar .tb-sep { display: none; } .toolbar { gap: 6px; padding-left: 14px; } }
@container (max-width: 420px) { .toolbar .crumbs { display: none; } .toolbar .chgnav { margin-right: auto; } }
.group.preview { flex: 0 0 47%; border-left: 1px solid var(--line); background: var(--side); }
.tabs { height: 40px; flex: none; display: flex; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 13px; color: var(--tx3); border-right: 1px solid var(--line); cursor: pointer; white-space: nowrap; transition: color .12s, background .12s; flex: none; }
.tab:hover { color: var(--tx2); background: rgba(255,255,255,.012); }
.tab.on { color: var(--tx); background: var(--bg); }
.tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--y); }
.tab .x { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; color: var(--tx4); }
.tab .x:hover { background: var(--raised); color: var(--tx); }
.tab .x .stdot { width: 7px; height: 7px; border-radius: 50%; }
.tab .x .stdot.M { background: var(--mod); } .tab .x .stdot.A { background: var(--add); }
.tab .x .xi { display: none; }
.tab:hover .x .xi, .tab.on .x .xi { display: block; }
.tab:hover .x .stdot, .tab.on .x .stdot { display: none; }
.toolbar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--tx3); min-width: 0; overflow: hidden; white-space: nowrap; flex: 1; }
.crumbs .last { color: var(--tx); font-weight: 500; }
.crumbs svg { color: var(--tx4); }
.by-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx3); padding: 0 8px; height: 24px; border-radius: 6px; background: rgba(236,231,223,.04); border: 1px solid var(--line); white-space: nowrap; }
.tb-sep { width: 1px; height: 18px; background: var(--line2); flex: none; }
.chgnav { display: flex; align-items: center; gap: 2px; font-size: 12.5px; color: var(--tx2); white-space: nowrap; }
.chgnav .lbl { padding: 0 6px; font-variant-numeric: tabular-nums; }
.chgnav button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--tx3); }
.chgnav button:hover { background: var(--raised); color: var(--tx); }
.btn.on-preview { color: var(--tx); border-color: rgba(255,212,0,.4); background: var(--yd); }

.editor-scroll { flex: 1; overflow: auto; min-height: 0; padding: 14px 0 120px; font: 13px/22px var(--mono); position: relative; }
.code { min-width: max-content; }
.row { display: flex; min-height: 22px; position: relative; }
.row .ln { width: 56px; flex: none; text-align: right; padding-right: 18px; color: var(--tx4); user-select: none; font-size: 12px; }
.row .mk { width: 14px; flex: none; color: transparent; user-select: none; }
.row .cd { white-space: pre; padding-right: 40px; color: #ddd6cb; flex: 1; }
.row:hover .ln { color: var(--tx3); }
.row.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0%, 40% { background: rgba(255,212,0,.13); } 100% { background: transparent; } }
.row.cur .ln { color: var(--tx2); }
.blk { position: relative; margin: 2px 0; }
.blk::before { content: ''; position: absolute; left: 50px; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: var(--line2); transition: background .15s; }
.blk.focus::before { background: var(--y); }
.blk .row.del { background: var(--delbg); }
.blk .row.del .cd { color: #cdb4ab; }
.blk .row.del .mk { color: var(--del); }
.blk .row.add { background: var(--addbg); }
.blk .row.add .mk { color: var(--add); }
.blk .row.del .cd span { opacity: .8; }
.blk-row { position: sticky; left: 0; width: calc(100cqw - 12px); height: 32px; display: flex; align-items: center; z-index: 1; }
.blk-row .gut { width: 70px; flex: none; }
.blk-bar { display: inline-flex; align-items: center; gap: 2px; padding: 3px; background: var(--raised); border: 1px solid var(--line2); border-radius: 9px; font-family: var(--ui); opacity: .85; transition: opacity .15s, border-color .15s; }
.blk:hover .blk-bar, .blk.focus .blk-bar { opacity: 1; border-color: #4a443d; }
.blk-bar button { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; color: var(--tx2); transition: background .12s, color .12s; }
.blk-bar button:hover { background: var(--hover); color: var(--tx); }
.blk-bar button.keep { color: var(--add); }
.blk-bar button.keep:hover { background: var(--addbg); }
.blk-bar button.undo:hover { color: var(--del); background: var(--delbg); }
.blk-bar .bk { font: 500 11px var(--ui); color: var(--tx4); padding: 0 8px 0 6px; border-left: 1px solid var(--line2); margin-left: 4px; }
.blk.newfile::before { background: var(--add); opacity: .5; }
.new-banner { margin: 0 18px 12px 56px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r3); border: 1px solid rgba(143,191,138,.25); background: var(--addbg); font: 13px/1.4 var(--ui); color: var(--tx2); }
.new-banner b { color: var(--tx); font-weight: 600; }

.t-k { color: #e3a874; } .t-s { color: #b9c48c; } .t-c { color: #7c746a; font-style: italic; } .t-n { color: #e09a8c; } .t-t { color: #9db7cc; } .t-p { color: #8f877c; }

.welcome { flex: 1; display: grid; place-items: center; color: var(--tx3); }
.welcome .in { text-align: center; max-width: 380px; }
.welcome h3 { margin: 16px 0 6px; color: var(--tx); font-size: 17px; font-weight: 600; }
.welcome .keys { margin-top: 22px; display: grid; grid-template-columns: 1fr auto; gap: 10px 26px; text-align: left; font-size: 13px; }

/* ---------- preview ---------- */
.pv-head { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); background: var(--bg); font-size: 13px; color: var(--tx); }
.pv-head .live { width: 7px; height: 7px; border-radius: 50%; background: var(--add); box-shadow: 0 0 0 3px rgba(143,191,138,.15); }
.pv-head .sub { color: var(--tx3); font-size: 12px; }
.pv-bar { height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.pv-url { flex: 1; min-width: 0; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: var(--r2); background: var(--surf); border: 1px solid var(--line); font: 12px var(--mono); color: var(--tx2); }
.pv-url svg { color: var(--tx4); }
.pv-url .host { color: var(--tx); }
.pv-stage { flex: 1; min-height: 0; padding: 14px; background: var(--side); position: relative; }
.pv-frame { height: 100%; border-radius: var(--r3); overflow: hidden; border: 1px solid var(--line2); box-shadow: 0 10px 30px rgba(0,0,0,.35); position: relative; background: #fff; }
.pv-load { position: absolute; left: 0; top: 0; height: 2px; background: var(--y); width: 0; z-index: 3; }
.pv-load.go { animation: load .7s var(--ease) forwards; }
@keyframes load { 0% { width: 0; opacity: 1; } 80% { width: 100%; opacity: 1; } 100% { width: 100%; opacity: 0; } }

.site { --s-bg: #fbf8f3; --s-card: #ffffff; --s-tx: #1d1915; --s-tx2: #6e655b; --s-line: #e8e1d6; --s-acc: #b5462f; height: 100%; overflow: auto; background: var(--s-bg); color: var(--s-tx); font-family: var(--ui); transition: background .3s, color .3s; }
.site.dark { --s-bg: #141210; --s-card: #1d1a17; --s-tx: #f4efe7; --s-tx2: #a99f93; --s-line: #33302b; --s-acc: #f0a24f; }
.site .nav { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-bottom: 1px solid var(--s-line); font-size: 12px; color: var(--s-tx2); }
.site .nav .mark { width: 22px; height: 22px; border-radius: 50%; background: var(--s-acc); display: grid; place-items: center; color: #fff; font: 700 11px/1 Georgia, serif; }
.site .nav b { color: var(--s-tx); font-size: 13px; font-weight: 650; }
.site .nav .links { margin-left: auto; display: flex; gap: 14px; }
.site .hero { padding: 26px 22px 8px; display: flex; align-items: flex-end; gap: 12px; }
.site .hero .eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--s-acc); font-weight: 700; }
.site h1 { font: 600 28px/1.1 Georgia, 'Times New Roman', serif; margin: 6px 0 4px; letter-spacing: -.01em; }
.site .hero p { margin: 0; font-size: 12.5px; color: var(--s-tx2); }
.site .theme-toggle { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--s-line); background: var(--s-card); color: var(--s-tx); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: background .2s, border-color .2s, transform .1s; flex: none; }
.site .theme-toggle:hover { border-color: var(--s-acc); }
.site .theme-toggle:active { transform: scale(.97); }
.site .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 16px 22px 26px; }
.site .card { border: 1px solid var(--s-line); border-radius: 12px; padding: 14px 14px 12px; background: var(--s-card); display: flex; flex-direction: column; gap: 4px; transition: background .3s, border-color .3s; }
.site .card h3 { margin: 0; font: 600 15px/1.25 Georgia, serif; }
.site .card p { margin: 0; font-size: 12px; color: var(--s-tx2); line-height: 1.45; flex: 1; }
.site .card strong { margin-top: 8px; font-size: 13.5px; color: var(--s-acc); font-variant-numeric: tabular-nums; }
.site .foot { padding: 0 22px 22px; font-size: 11px; color: var(--s-tx2); }
.pv-frame { container-type: inline-size; }
.site .nav span { white-space: nowrap; }
@container (max-width: 460px) { .site .nav .links, .site .nav .sub { display: none; } .site .hero { padding: 22px 18px 4px; } .site .grid { padding: 14px 18px 22px; gap: 10px; } .site .nav { padding: 12px 18px; } .site .foot { padding: 0 18px 18px; } .site h1 { font-size: 25px; } }
.crumbs .last { flex: none; }

/* ---------- terminal panel ---------- */
.terminal { flex: none; height: 250px; border-top: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; min-height: 0; }
.term-tabs { height: 36px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); }
.term-tab { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--tx3); transition: background .12s, color .12s; }
.term-tab:hover { color: var(--tx); background: var(--surf); }
.term-tab.on { color: var(--tx); background: var(--raised); }
.term-tabs .sp { flex: 1; }
.term-body { flex: 1; overflow: auto; padding: 10px 18px 16px; font: 12.5px/20px var(--mono); color: #d6cfc4; white-space: pre-wrap; min-height: 0; }
.rl { min-height: 20px; }
.rl.user { color: var(--tx); }
.rl.user .pr { color: var(--y); }
.rl.dim { color: var(--tx4); }
.rl.tool { color: var(--tx2); }
.rl.tool .fn { color: #9db7cc; }
.rl.ok { color: var(--add); }
.rl.ask { color: var(--y); }
.rl.out { color: var(--tx3); }
.rl .p { color: var(--add); } .rl .m { color: var(--del); }
.caret { display: inline-block; width: 8px; height: 15px; background: var(--tx2); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- dock ---------- */
.dock { background: var(--side); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.main.nodock .dock { border-left: 0; }
.dock-head { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--line); position: relative; }
.switcher { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px; border-radius: var(--r2); transition: background .12s; text-align: left; }
.switcher:hover { background: var(--surf); }
.switcher .t { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.switcher svg { color: var(--tx3); }
.dock-sub { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--tx3); min-width: 0; }
.dock-sub .meta { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
.switch { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--tx3); font-size: 12px; white-space: nowrap; flex: none; padding: 2px 4px; border-radius: 6px; }
.switch:hover { color: var(--tx2); }
.switch .trk { width: 28px; height: 16px; border-radius: 8px; background: var(--line2); position: relative; transition: background .15s; }
.switch .trk::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--tx2); transition: transform .16s var(--ease), background .16s; }
.switch.on .trk { background: rgba(255,212,0,.35); }
.switch.on .trk::after { transform: translateX(12px); background: var(--y); }
.switch.on { color: var(--tx); }
.menu { position: absolute; z-index: 30; background: var(--raised); border: 1px solid var(--line2); border-radius: var(--r4); box-shadow: var(--sh); padding: 6px; animation: pop .14s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.985); } to { opacity: 1; transform: none; } }
.menu .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r2); cursor: pointer; font-size: 13px; color: var(--tx2); }
.menu .mi:hover { background: var(--hover); color: var(--tx); }
.menu .mi.sel { color: var(--tx); }
.menu .mi .m2 { margin-left: auto; font-size: 11.5px; color: var(--tx4); white-space: nowrap; }
.menu .msep { height: 1px; background: var(--line2); margin: 5px 4px; }

.convo { flex: 1; overflow: auto; padding: 18px 18px 24px; min-height: 0; }
.msg-user { display: flex; justify-content: flex-end; margin: 4px 0 16px; }
.bubble { max-width: 86%; background: var(--raised); border: 1px solid var(--line2); border-radius: 14px 14px 4px 14px; padding: 9px 13px; font-size: 13.5px; line-height: 1.5; color: var(--tx); }
.prose { margin: 0 0 12px; font-size: 13.5px; line-height: 1.65; color: var(--tx2); }
.tool-row { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px; margin: 0 0 6px; border-radius: var(--r2); background: var(--surf); border: 1px solid var(--line); font-size: 12.5px; color: var(--tx2); text-align: left; transition: background .12s, border-color .12s; }
.tool-row:hover { background: var(--raised); border-color: var(--line2); color: var(--tx); }
.tool-row svg { color: var(--tx3); }
.tool-row .vb { color: var(--tx3); flex: none; }
.tool-row .pth { font-family: var(--mono); font-size: 12px; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tool-row .nums { margin-left: auto; padding-left: 8px; }
.tool-row .go { color: var(--tx4); opacity: 0; transition: opacity .12s; }
.tool-row:hover .go { opacity: 1; }
.tool-group { margin: 2px 0 14px; }
.run { margin: 0 0 14px; border-radius: var(--r2); border: 1px solid var(--line); background: var(--surf); overflow: hidden; }
.run-head { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 10px; font-size: 12.5px; color: var(--tx3); }
.run-head code { font: 12px var(--mono); color: var(--tx); }
.run-head .spin { margin-left: auto; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line2); border-top-color: var(--add); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.run-out { margin: 0; padding: 8px 12px 9px; border-top: 1px solid var(--line); font: 12px/1.6 var(--mono); color: var(--tx3); white-space: pre-wrap; background: rgba(0,0,0,.14); }
.done-row { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 14px; padding: 10px 12px; border-radius: var(--r3); background: var(--addbg); border: 1px solid rgba(143,191,138,.22); font-size: 13.5px; line-height: 1.55; color: var(--tx); }
.done-row svg { color: var(--add); margin-top: 3px; }
.note-row { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 12.5px; color: var(--tx3); }
.note-row svg { color: var(--tx3); }
.working { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; font-size: 13px; color: var(--tx3); }
.shimmer { background: linear-gradient(90deg, var(--tx3) 0%, var(--tx) 45%, var(--tx3) 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 2.2s linear infinite; font-weight: 500; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.working .el { margin-left: auto; font-size: 12px; color: var(--tx4); font-variant-numeric: tabular-nums; }
.acard { border-radius: var(--r4); border: 1px solid var(--line2); background: var(--surf); padding: 14px; margin: 6px 0 14px; }
.acard.ask { border-color: rgba(255,212,0,.38); background: linear-gradient(180deg, rgba(255,212,0,.06), rgba(255,212,0,.015)); box-shadow: 0 0 0 4px rgba(255,212,0,.04); }
.acard .ch { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; color: var(--tx); }
.acard .ch svg { color: var(--y); }
.acard .cmd { margin: 10px 0 8px; padding: 9px 11px; border-radius: var(--r2); background: rgba(0,0,0,.25); border: 1px solid var(--line); font: 12.5px var(--mono); color: var(--tx); }
.acard .cmd .pr { color: var(--tx4); margin-right: 8px; }
.acard .cd2 { font-size: 12.5px; color: var(--tx3); line-height: 1.5; }
.acard .cbtns { display: flex; gap: 8px; margin-top: 12px; }
.acard .cbtns .btn { flex: 1; }
.acard.merge .ch svg { color: var(--tx2); }
.acard .flist { margin: 10px 0 2px; }
.acard .frow { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--tx2); padding: 3px 0; }
.acard .frow .nums { margin-left: auto; }
.composer { flex: none; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.comp-box { border: 1px solid var(--line2); background: var(--surf); border-radius: var(--r4); padding: 10px 10px 8px 12px; transition: border-color .15s, box-shadow .15s; }
.comp-box:focus-within { border-color: rgba(255,212,0,.55); box-shadow: 0 0 0 3px rgba(255,212,0,.08); }
.comp-box textarea { width: 100%; background: none; border: 0; resize: none; font-size: 13.5px; line-height: 1.5; color: var(--tx); height: 42px; display: block; }
.comp-box textarea::placeholder { color: var(--tx4); }
.comp-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11.5px; color: var(--tx4); }
.comp-row .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--raised); color: var(--tx3); font-size: 11.5px; }
.send { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--raised); color: var(--tx4); transition: background .15s, color .15s, transform .1s; }
.send.ready { background: var(--y); color: #191400; }
.send.ready:hover { background: #ffe042; }
.send:active { transform: scale(.95); }
.raw { flex: 1; overflow: auto; padding: 14px 16px 20px; font: 12.5px/20px var(--mono); white-space: pre-wrap; background: #100f0e; min-height: 0; color: #d6cfc4; }
.dock-empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--tx3); font-size: 13px; padding: 30px; }

/* ---------- status bar ---------- */
.statusbar { display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--side); border-top: 1px solid var(--line); font-size: 12px; color: var(--tx3); white-space: nowrap; overflow: hidden; }
.sbi { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; transition: background .12s, color .12s; }
button.sbi:hover { background: var(--surf); color: var(--tx); }
.sbi.on { color: var(--tx); background: var(--surf); }
.statusbar .sp { flex: 1; }
.meter { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.meter .bar { width: 30px; height: 4px; border-radius: 2px; background: var(--line2); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 2px; }
.meter .v { color: var(--tx2); font-variant-numeric: tabular-nums; }

.mock-label { position: fixed; left: 58px; bottom: 34px; z-index: 5; font-size: 11px; color: var(--tx4); padding: 3px 8px; border-radius: 6px; background: rgba(18,17,16,.75); border: 1px solid var(--line); pointer-events: none; letter-spacing: .02em; }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(8,7,6,.55); backdrop-filter: blur(3px); animation: fade .15s var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.palette { position: fixed; z-index: 51; left: 50%; top: 64px; transform: translateX(-50%); width: min(660px, calc(100vw - 48px)); background: var(--surf); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--sh); overflow: hidden; animation: pop .16s var(--ease); }
.pal-in { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--tx3); }
.pal-in input { flex: 1; background: none; border: 0; font-size: 16px; color: var(--tx); min-width: 0; }
.pal-in input::placeholder { color: var(--tx4); }
.pal-list { max-height: min(430px, calc(100vh - 220px)); overflow: auto; padding: 6px 8px 8px; }
.pal-g { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--tx4); padding: 10px 10px 5px; }
.pal-i { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 10px; border-radius: var(--r2); cursor: pointer; font-size: 13.5px; color: var(--tx2); position: relative; }
.pal-i svg { color: var(--tx3); }
.pal-i.sel { background: var(--raised); color: var(--tx); }
.pal-i.sel::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--y); }
.pal-i.sel svg { color: var(--tx); }
.pal-i .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-i .lb .dim { color: var(--tx4); margin-left: 8px; font-size: 12.5px; }
.pal-i .lb b { color: var(--y); font-weight: 600; }
.pal-i.start { color: var(--tx); }
.pal-i.start .q { color: var(--tx); font-weight: 500; }
.pal-i .ent { font-size: 11.5px; color: var(--tx4); }
.pal-foot { display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--tx4); }
.pal-foot span { display: flex; align-items: center; gap: 6px; }
.pal-empty { padding: 14px 10px 6px; font-size: 12.5px; color: var(--tx4); }

.modal { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(600px, calc(100vw - 48px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--surf); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--sh); animation: popc .17s var(--ease); }
@keyframes popc { from { opacity: 0; transform: translate(-50%, -48%) scale(.985); } to { opacity: 1; transform: translate(-50%, -50%); } }
.mh { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 4px 22px; }
.mh h3 { margin: 0; font-size: 16px; font-weight: 600; }
.mh p { margin: 4px 0 0; font-size: 13px; color: var(--tx3); }
.mh .iconbtn { margin-left: auto; margin-top: -4px; }
.mb { padding: 14px 22px 4px; overflow: auto; min-height: 0; }
.mf { display: flex; align-items: center; gap: 8px; padding: 14px 20px 18px 22px; }
.mf .hint { font-size: 12px; color: var(--tx4); margin-right: auto; display: flex; align-items: center; gap: 6px; }
.flabel { font-size: 12px; font-weight: 600; color: var(--tx3); margin: 0 0 8px; letter-spacing: .01em; }
.cli-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.cli-card { position: relative; text-align: left; border: 1px solid var(--line2); background: var(--side); border-radius: var(--r4); padding: 12px; transition: border-color .15s, background .15s, box-shadow .15s; cursor: pointer; }
.cli-card:hover { border-color: #4a443d; background: var(--raised); }
.cli-card.sel { border-color: rgba(255,212,0,.65); background: var(--raised); box-shadow: 0 0 0 3px rgba(255,212,0,.08); }
.cli-card .top { display: flex; align-items: center; gap: 9px; }

function hl(line, lang) { return line === '' ? '' : M.highlight(line, lang === 'css' ? 'css' : lang); }
function rowHtml(cls, ln, mark, code, lang) { return `<div class="row ${cls}" ${ln ? `data-ln="${ln}"` : ''}><span class="ln">${ln || ''}</span><span class="mk">${mark}</span><span class="cd">${hl(code, lang)}</span></div>`; }
function editorBody(p) {
  const f = M.files[p], lang = f.lang; let h = '', ln = 1;
  const c = S.changes[p];
  if (!c || !isChanged(p) && !c.isNew) {
    const lines = fileText(p).split('\n'); if (lines[lines.length - 1] === '') lines.pop();
    lines.forEach(l => { h += rowHtml('', ln++, '', l, lang); });
    return h;
  }
  if (c.isNew) {
    const lines = c.b.slice(); if (lines[lines.length - 1] === '') lines.pop();
    if (c.st[0] === 'p') {
      h += `<div class="new-banner">${I('filePlus')}<span><b>New file</b> written by ${cliName(c.by)}. Keep it or undo to remove it.</span></div>`;
      h += `<div class="blk newfile">` + lines.map(l => rowHtml('add', ln++, '+', l, lang)).join('') + '</div>';
    } else lines.forEach(l => { h += rowHtml('', ln++, '', l, lang); });
    return h;
  }
  const { a, b, hunks } = c.d; let bi = 0, pi = 0;
  const pendIdx = c.st.map((s, i) => s === 'p' ? i : -1).filter(i => i >= 0);
  const cur = pendIdx[Math.min(S.navIdx[p] || 0, pendIdx.length - 1)];
  const rows = [];
  hunks.forEach((hk, i) => {
    while (bi < hk.bStart) rows.push(rowHtml('', ln++, '', b[bi++], lang));
    const st = c.st[i];
    if (st === 'p') {
      let blk = `<div class="blk ${i === cur ? 'focus' : ''}" data-blk="${i}">`; const bar = `<div class="blk-row"><span class="gut"></span><div class="blk-bar"><button class="undo" data-act="undoBlk" data-path="${esc(p)}" data-i="${i}" title="Undo this change">${I('undo', 's14')}Undo</button><button class="keep" data-act="keepBlk" data-path="${esc(p)}" data-i="${i}" title="Keep this change">${I('check', 's14')}Keep</button><span class="bk">${pi + 1} of ${pendIdx.length}</span></div></div>`;
      a.slice(hk.aStart, hk.aStart + hk.aLen).forEach(l => { blk += rowHtml('del', 0, '-', l, lang); });
      b.slice(hk.bStart, hk.bStart + hk.bLen).forEach(l => { blk += rowHtml('add', ln++, '+', l, lang); });
      rows.push(blk + bar + "</div>"); pi++;
    } else if (st === 'k') b.slice(hk.bStart, hk.bStart + hk.bLen).forEach(l => rows.push(rowHtml('', ln++, '', l, lang)));
    else a.slice(hk.aStart, hk.aStart + hk.aLen).forEach(l => rows.push(rowHtml('', ln++, '', l, lang)));
    bi += hk.bLen;
  });
  while (bi < b.length) { const l = b[bi]; if (!(bi === b.length - 1 && l === '')) rows.push(rowHtml('', ln++, '', l, lang)); bi++; }
  return rows.join('');
}

/* ---------------- raw transcripts ---------------- */
function parseTool(t) {
  const m = /^(Read|Write|Edit)\s+(\S+)(?:\s+\(([^)]*)\))?/.exec(t);
  if (!m) return { verb: t, path: '', add: 0, del: 0 };
  const a = /\+(\d+)/.exec(m[3] || ''), d = /-(\d+)/.exec(m[3] || '');
  return { kind: m[1], verb: { Read: 'Read', Write: 'Created', Edit: 'Edited' }[m[1]], path: m[2], add: a ? +a[1] : 0, del: d ? +d[1] : 0, hasNums: !!m[3] };
}
function rawHtml(a) {
  const head = {
    claude: [`Claude Code  ${a.model}`, 'C:\\code\\menu-app'],
    codex: [`codex  ${a.model}`, a.worktree ? a.worktree : 'C:\\code\\menu-app'],
    grok: [`grok-cli  ${a.model}`, a.worktree ? a.worktree : 'C:\\code\\menu-app'],
  }[a.cli];
  let h = `<div class="rl dim">${esc(head[0])}</div><div class="rl dim">${esc(head[1])}</div><div class="rl"> </div>`;
  a.log.forEach(([k, t]) => {
    if (k === 'user') h += `<div class="rl user"><span class="pr">&gt; </span>${esc(t)}</div><div class="rl"> </div>`;
    else if (k === 'text') h += `<div class="rl">${esc(t)}</div>`;
    else if (k === 'tool') { const x = parseTool(t); h += `<div class="rl tool">  <span class="fn">${x.kind || 'Tool'}</span>(${esc(x.path)})${x.hasNums ? `  <span class="p">+${x.add}</span> <span class="m">-${x.del}</span>` : ''}</div>`; }
    else if (k === 'run') h += `<div class="rl tool">  <span class="fn">Run</span>(${esc(t)})</div>`;
    else if (k === 'out') h += `<div class="rl out">    ${esc(t.trim())}</div>`;
    else if (k === 'done') h += `<div class="rl ok">${esc(t)}</div>`;
    else if (k === 'ask') h += a.state === 'waiting' ? `<div class="rl ask">? ${esc(t)}  [y/n]</div>` : `<div class="rl ask">? ${esc(t)}  y</div>`;
    else if (k === 'allowed' || k === 'denied') h += `<div class="rl dim">  ${k === 'allowed' ? 'Allowed' : 'Denied'}: ${esc(t)}</div>`;
  });
  if (a.state === 'working' && !a.merged) h += `<div class="rl dim"> </div><div class="rl"><span class="caret"></span></div>`;
  if (a.merged) h += `<div class="rl ok">Merged into main.</div>`;
  return h;
}

function convoHtml(a) {
  let h = '';
  const L = a.log;
  for (let i = 0; i < L.length; i++) {
    const [k, t] = L[i];
    if (k === 'user') h += `<div class="msg-user"><div class="bubble">${esc(t)}</div></div>`;
    else if (k === 'text') h += `<p class="prose">${esc(t)}</p>`;
    else if (k === 'tool') {
      let g = '';
      while (i < L.length && L[i][0] === 'tool') {
        const x = parseTool(L[i][1]);
        const ic = x.kind === 'Read' ? 'eye' : x.kind === 'Write' ? 'filePlus' : 'pencil';
        g += `<button class="tool-row" data-act="open" data-path="${esc(x.path)}" data-agent="${a.id}">${I(ic, 's14')}<span class="vb">${x.verb}</span><span class="pth">${esc(x.path)}</span>${x.hasNums ? nums(x.add, x.del) : ''}<span class="go">${I('cr', 's14')}</span></button>`;
        i++;
      }
      i--; h += `<div class="tool-group">${g}</div>`;

  const a = agentById(o.id); const f = M.files['src/lib/pricing.ts'];
  const cd = compactDiff(f.before, f.after);
  return `<div class="modal" role="dialog" style="width:min(640px, calc(100vw - 48px))"><div class="mh"><div><h3>Merge ${cliName(a.cli)} into main</h3><p>${esc(a.title)}. It worked in its own copy, so main has not changed yet.</p></div><button class="iconbtn" data-act="close" title="Close">${I('x')}</button></div>
  <div class="mb"><div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><span class="wt-chip">${I('copy', 's14')}${esc(a.worktree)}</span>${I('arrowR', 's14')}<span class="wt-chip">${I('git', 's14')}main</span></div>
  <div class="flabel">1 file, ${a.add} lines added, ${a.del} removed</div>
  ${a.files.map(p => `<div class="mfile"><span class="ficon ts">${I('file', 's14')}</span><span class="pth">${esc(p)}</span>${nums(cd.add, cd.del)}</div>`).join('')}
  ${cd.html}
  <div class="opt" data-act="toggleOpt" style="margin-top:8px;border-top:0"><span class="chk on">${I('check', 's14')}</span><div><div class="ot">Clean up its copy after merging</div><div class="od">Removes .vibedeck/worktrees/fix-price-rounding</div></div></div></div>
  <div class="mf"><span class="hint">${I('check', 's14')}Tests passed: 4 of 4</span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="doMerge" data-id="${a.id}">${I('merge', 's14')}Merge into main</button></div></div>`;
}

/* ---- new agent modal ---- */
function newAgentHtml() {
  const n = S.na;
  const card = k => `<div class="cli-card ${n.all || n.cli === k ? 'sel' : ''}" data-act="naCli" data-cli="${k}" tabindex="0"><div class="top"><span class="mk" style="background:${M.colors[k]}">${cliName(k)[0]}</span><span class="nm">${cliName(k)}</span><span class="rd"></span></div><div class="ds">${CLI_DESC[k]}</div><div class="sel-wrap"><select data-model="${k}">${MODELS[k].map(m => `<option ${n.models[k] === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>${I('cd', 's14')}</div></div>`;
  const count = n.all ? 3 : 1;
  return `<div class="modal" role="dialog"><div class="mh"><div><h3>New agent</h3><p>Give it a task. It works on menu-app while you keep going.</p></div><button class="iconbtn" data-act="close" title="Close">${I('x')}</button></div>
  <div class="mb"><div class="flabel">Which CLI</div><div class="cli-cards">${['claude', 'codex', 'grok'].map(card).join('')}</div>
  <div class="flabel">Task</div><textarea class="task-box" id="taskIn" placeholder="Describe what you want done, like: add a specials banner with a slide-in" spellcheck="false">${esc(n.task)}</textarea>
  <div class="opts"><div class="opt" data-act="naCopy"><div><div class="ot">Work in its own copy of the project</div><div class="od">Changes stay separate until you merge them.</div></div><span class="switch ${n.copy || n.all ? 'on' : ''}"><span class="trk"></span></span></div>
  <div class="opt" data-act="naAll"><span class="chk ${n.all ? 'on' : ''}">${I('check', 's14')}</span><div><div class="ot">Send to all three and compare</div><div class="od">Claude, Codex and Grok each try it in their own copy. You pick the best one.</div></div></div></div></div>
  <div class="mf"><span class="hint"><span class="kbd">Ctrl+Enter</span>to start</span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="createAgent">${I('plus', 's14')}${count === 3 ? 'Start 3 agents' : 'Start ' + cliName(n.cli)}</button></div></div>`;
}
function openNewAgent(task) { S.na.task = task || ''; S.na.all = false; openOverlay({ type: 'newAgent' }); }
function createAgent() {
  const n = S.na; const ta = $('#taskIn'); if (ta) n.task = ta.value;
  const task = n.task.trim(); if (!task) { if (ta) { ta.focus(); ta.style.borderColor = 'rgba(217,139,122,.7)'; } toast('Add a task first', 'pencil'); return; }
  const clis = n.all ? ['claude', 'codex', 'grok'] : [n.cli];
  const title = task.length > 42 ? task.slice(0, 40).replace(/\s+\S*$/, '') + '...' : task;
  const slug = task.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 28);
  const first = [];
  clis.forEach(k => {
    const id = 'n' + (++S.seq); first.push(id);
    S.agents.push({ id, cli: k, model: n.models[k], title: title.charAt(0).toUpperCase() + title.slice(1), state: 'working', worktree: (n.copy || n.all) ? `.vibedeck/worktrees/${slug}${n.all ? '-' + k : ''}` : null, started: 'now', files: [], add: 0, del: 0, merged: false,
      log: [['user', task], ['text', k === 'claude' ? "I'll read the project rules first, then plan the change." : k === 'codex' ? 'Reading AGENTS.md and the files this touches.' : 'Looking around the project first.'], ['tool', 'Read AGENTS.md']] });
  });
  closeTop(); S.dockAgent = first[0]; S.dockOpen = true; S.dockRaw = false;
  if (S.view === 'files' && S.sbOpen) {}
  toast(clis.length > 1 ? 'Started 3 agents. Compare them when they finish' : `Started ${cliName(clis[0])}`, 'agents');
  renderChrome();
}

/* ---- compare ---- */
const PRICING_BEFORE = M.files['src/lib/pricing.ts'].before;
const CLAUDE_ALT = `// Menu pricing helpers
export type Item = { name: string; price: number; qty: number };

const roundCents = (n: number) => Math.round((n + Number.EPSILON) * 100) / 100;

export function lineTotal(item: Item) {
  return roundCents(item.price * item.qty);
}

export function subtotal(items: Item[]) {
  let total = 0;
  for (const i of items) total += lineTotal(i);
  return roundCents(total);
}

export function withTax(amount: number, rate = 0.0625) {
  return roundCents(amount + amount * rate);
}

export function formatPrice(n: number) {
  return '$' + roundCents(n).toFixed(2);
}
`;
const GROK_ALT = PRICING_BEFORE.replace("return '$' + n;", () => "return '$' + n.toFixed(2);");
function compareHtml() {
  const cols = [
    { id: 'a2', cli: 'codex', model: 'GPT-6-Sol', time: '1m 48s', tag: 'Smallest clean fix', appr: 'Rounds each line to cents inside lineTotal, swaps the loop for reduce, and formats with Intl.NumberFormat so every price prints as $12.50.', after: M.files['src/lib/pricing.ts'].after, files: [['src/lib/pricing.ts']], tests: '4 of 4' },
    { id: 'c-claude', cli: 'claude', model: 'Opus 5.5', time: '2m 31s', tag: 'Most thorough', appr: 'Adds one roundCents helper and uses it at every step: line totals, subtotal and tax. Keeps the plain $ format and adds a test for the $3.3333 case.', after: CLAUDE_ALT, files: [['src/lib/pricing.ts'], ['src/lib/pricing.test.ts', 9, 0]], tests: '5 of 5' },
    { id: 'c-grok', cli: 'grok', model: 'grok-4.5', time: '0m 52s', tag: 'Display only', appr: 'Only changes formatPrice to print two decimals. Fast and tiny, but totals can still be off by a cent before they are shown.', after: GROK_ALT, files: [['src/lib/pricing.ts']], tests: '4 of 4' },
  ];
  const html = cols.map(c => {
    const d = compactDiff(PRICING_BEFORE, c.after);
    let add = d.add, del = d.del; c.files.forEach(f => { if (f[1] != null) { add += f[1]; del += f[2]; } });
    const won = S.cmpWon === c.id;
    return `<div class="cmp-col ${won ? 'won' : ''}"><div class="cc-head"><span class="mk" style="background:${M.colors[c.cli]}">${cliName(c.cli)[0]}</span><div><div class="nm">${cliName(c.cli)}</div><div class="md">${esc(c.model)} · ${c.time}</div></div><span class="tag">${esc(c.tag)}</span></div>
    <div class="cc-body"><div class="cc-sec">Approach</div><p class="cc-appr">${esc(c.appr)}</p>
    <div class="cc-stats"><div class="cc-stat"><div class="k">Files</div><div class="v">${c.files.length}</div></div><div class="cc-stat"><div class="k">Lines</div><div class="v">${nums(add, del)}</div></div><div class="cc-stat"><div class="k">Tests</div><div class="v">${c.tests}</div></div></div>
    <div class="cc-sec">Files</div><div class="cc-files">${c.files.map(f => { const n2 = f[1] != null ? [f[1], f[2]] : [d.add, d.del]; return `<div class="cc-file">${I('file', 's14')}${esc(f[0])}${nums(n2[0], n2[1])}</div>`; }).join('')}</div>
    <div class="cc-sec">Main change</div>${d.html}</div>
    <div class="cc-foot"><button class="btn ${won ? 'won' : ''}" data-act="cmpMerge" data-id="${c.id}" data-cli="${c.cli}">${I(won ? 'check' : 'merge', 's14')}${won ? 'Merged' : 'Merge this one'}</button></div></div>`;
  }).join('');
  return `<div class="compare" role="dialog"><div class="cmp-head"><div><h3>Compare results</h3><p>Three agents tried the same task. Pick the one to bring into main.</p></div><span class="task">"Prices show like $12.5 and $3.3333. Fix rounding everywhere."</span><button class="iconbtn" data-act="close" title="Close  Esc">${I('x')}</button></div><div class="cmp-cols">${html}</div></div>`;
}

/* ---------------- toggles ---------------- */
function toggleTerm() { S.termOpen = !S.termOpen; if (S.termOpen && S.termTab !== 'shell' && !agentById(S.termTab)) S.termTab = 'shell'; renderChrome(); }
function togglePreview() {
  S.previewOpen = !S.previewOpen;
  if (S.previewOpen && S.sbOpen) { S.sbOpen = false; S.sbAuto = true; }
  else if (!S.previewOpen && S.sbAuto) { S.sbOpen = true; S.sbAuto = false; }
  renderChrome(); if (S.previewOpen) reload();
}
function reload() { const l = $('#pvLoad'); if (!l) return; l.classList.remove('go'); void l.offsetWidth; l.classList.add('go'); }

/* ---------------- events ---------------- */
const ACT = {
  palette: () => openPalette('cmd'),
  pill: () => { S.view = 'agents'; S.sbOpen = true; S.dockOpen = true; renderChrome(); },
  dock: () => { S.dockOpen = !S.dockOpen; S.switcherOpen = false; renderChrome(); },
  term: toggleTerm,
  view: el => { const v = el.dataset.v; S.sbAuto = false; if (S.view === v && S.sbOpen && el.classList.contains('act')) S.sbOpen = false; else { S.view = v; S.sbOpen = true; } renderChrome(); },
  dir: el => { const find = (ns) => { for (const n of ns) { if (n.key === el.dataset.key) return n; if (n.dir) { const r = find(n.children); if (r) return r; } } }; const n = find(S.tree); if (n) { n.open = !n.open; renderSidebar(); } },
  collapseAll: () => { (function w(ns) { ns.forEach(n => { if (n.dir) { n.open = false; w(n.children); } }); })(S.tree); renderSidebar(); },
  open: el => openFile(el.dataset.path, +el.dataset.line || 0, el.dataset.agent),
  tab: el => { S.active = el.dataset.path; renderChrome(); },
  closeTab: el => closeTab(el.dataset.path),
  keepBlk: el => resolveBlk(el.dataset.path, +el.dataset.i, 'k'),
  undoBlk: el => resolveBlk(el.dataset.path, +el.dataset.i, 'u'),
  keepFile: el => resolveFile(el.dataset.path, 'k'),
  undoFile: el => resolveFile(el.dataset.path, 'u'),
  navPrev: () => nav(-1), navNext: () => nav(1),
  preview: togglePreview,
  previewDark: () => { S.previewDark = !S.previewDark; const s = $('#site'); if (s) { s.classList.toggle('dark', S.previewDark); s.querySelector('.theme-toggle').innerHTML = I(S.previewDark ? 'sun' : 'moon', 's14') + (S.previewDark ? 'Light mode' : 'Dark mode'); } },
  reload: () => { reload(); toast('Reloaded localhost:3000', 'refresh'); },
  selAgent: el => selAgent(el.dataset.id),
  switcher: () => { S.switcherOpen = !S.switcherOpen; renderDock(); },
  raw: () => { S.dockRaw = !S.dockRaw; renderDock(); },
  send: sendMsg,
  allow: el => allow(el.dataset.id), deny: el => deny(el.dataset.id),
  merge: el => openOverlay({ type: 'merge', id: el.dataset.id }),
  doMerge: el => doMerge(el.dataset.id),
  newAgent: () => openNewAgent(),
  compare: () => openOverlay({ type: 'compare' }),
  cmpMerge: el => { const id = el.dataset.id; if (S.cmpWon === id) return; S.cmpWon = id; if (id === 'a2') { const a = agentById('a2'); if (a) a.merged = true; } toast(`Merged ${cliName(el.dataset.cli)}'s version into main`, 'merge'); closeAll(); renderChrome(); },
  termTab: el => { S.termTab = el.dataset.id; renderTerminal(); },
  close: () => closeTop(), scrim: () => closeTop(),
  palRun: el => runPal(+el.dataset.i),
  naCli: el => { S.na.cli = el.dataset.cli; S.na.all = false; keepTask(); renderOverlays(); },
  naCopy: () => { if (S.na.all) return toast('Compare mode always uses separate copies', 'copy'); S.na.copy = !S.na.copy; keepTask(); renderOverlays(); },
  naAll: () => { S.na.all = !S.na.all; keepTask(); renderOverlays(); },
  createAgent,
  toggleOpt: el => { const c = el.querySelector('.chk'); if (c) c.classList.toggle('on'); },
  aiMsg: () => { S.commitMsg = aiMessage(); renderSidebar(); toast('Wrote a commit message', 'sparkle'); },
  commit: () => { const n = changedFiles().length; resolveAll('k'); S.commitMsg = ''; renderChrome(); toast(`Committed ${n} files to main`, 'git'); },
  toast: el => toast(el.dataset.msg, 'check'),
};
function keepTask() { const t = $('#taskIn'); if (t) S.na.task = t.value; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (S.switcherOpen && !e.target.closest('.menu') && !(el && el.dataset.act === 'switcher')) { S.switcherOpen = false; renderDock(); }
  if (!el) return;
  if (el.tagName === 'SELECT' || e.target.tagName === 'SELECT') return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.stopPropagation(); fn(el, e);
});
document.addEventListener('change', e => { if (e.target.matches('select[data-model]')) { S.na.models[e.target.dataset.model] = e.target.value; } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'palIn') { S.pal.q = t.value; S.pal.idx = 0; refreshPalList(); }
  else if (t.id === 'searchIn') { S.search = t.value; const r = searchResults(S.search); $('#searchRes').innerHTML = r.html; $('#searchMeta').textContent = r.meta; }
  else if (t.id === 'compIn') { S.drafts[S.dockAgent] = t.value; $('#sendBtn').classList.toggle('ready', !!t.value.trim()); }
  else if (t.id === 'commitIn') S.commitMsg = t.value;
  else if (t.id === 'taskIn') { S.na.task = t.value; t.style.borderColor = ''; }
});
document.addEventListener('keydown', e => {
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  const top = S.overlays[S.overlays.length - 1];
  if (k === 'Escape') {
    if (top) { e.preventDefault(); closeTop(); return; }
    if (S.switcherOpen) { S.switcherOpen = false; renderDock(); return; }
    return;
  }
  if (top && top.type === 'palette' && e.target.id === 'palIn') {
    const n = palItems().length;
    if (k === 'ArrowDown') { e.preventDefault(); S.pal.idx = (S.pal.idx + 1) % Math.max(1, n); refreshPalList(); return; }
    if (k === 'ArrowUp') { e.preventDefault(); S.pal.idx = (S.pal.idx - 1 + n) % Math.max(1, n); refreshPalList(); return; }
    if (k === 'Enter') { e.preventDefault(); runPal(S.pal.idx); return; }
  }
  if (top && top.type === 'newAgent' && ctrl && k === 'Enter') { e.preventDefault(); createAgent(); return; }
  if (e.target.id === 'compIn' && k === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); return; }
  if (ctrl && (k === 'k' || k === 'K') && !e.shiftKey) { e.preventDefault(); if (top && top.type === 'palette') closeTop(); else openPalette('cmd'); return; }
  if (ctrl && (k === 'p' || k === 'P') && !e.shiftKey) { e.preventDefault(); openPalette('file'); return; }
  if (ctrl && (k === 'n' || k === 'N') && !e.shiftKey) { e.preventDefault(); openNewAgent(); return; }
  if (ctrl && (k === '`' || e.code === 'Backquote')) { e.preventDefault(); toggleTerm(); return; }
  if (ctrl && e.shiftKey && (k === 'V' || k === 'v')) { e.preventDefault(); togglePreview(); return; }
  if (ctrl && e.shiftKey && (k === 'F' || k === 'f')) { e.preventDefault(); runCommand('Search in files'); return; }
  if (top) return;
  if (ctrl && k === 'Enter' && S.active && isChanged(S.active)) { e.preventDefault(); resolveFile(S.active, 'k'); return; }
});

renderAll();
window.__S = S;
})();
</script>
</body>
