<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeDeck Mission Control</title>
<style>
@font-face{font-family:'Inter';src:url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');font-weight:100 800;font-display:swap}
:root{
  --bg:#06080d;--panel:#0a0e15;--raised:#0f141d;--raised2:#141b27;--line:#18202c;--line2:#233044;--line3:#2e3e56;
  --text:#e6ebf2;--text2:#a9b4c4;--dim:#6b7789;--faint:#3c4759;
  --work:#4cc3ff;--wait:#ffb020;--done:#3ddc84;--merged:#6b7789;--fail:#ff5c5c;--brand:#ffd400;
  --mod:#e5b567;
  --add-bg:rgba(61,220,132,.085);--del-bg:rgba(255,92,92,.085);
  --r1:4px;--r2:6px;--r3:10px;--r4:14px;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','calt'}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:rgba(76,195,255,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1a2230;border:3px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#273349;background-clip:padding-box;border:3px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
.ic{flex:none;display:block}
:focus{outline:none}
:focus-visible{outline:2px solid rgba(76,195,255,.55);outline-offset:1px;border-radius:6px}
.mono{font-family:var(--mono)}
.ml{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.n-chip{font:500 10.5px/1 var(--mono);color:var(--text2);background:var(--raised2);border:1px solid var(--line2);border-radius:999px;padding:2px 6px}
kbd{font:500 10.5px/1 var(--mono);color:var(--dim);padding:2px 5px 1px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;background:var(--bg);white-space:nowrap}
.add{color:var(--done);font-weight:500}.del{color:var(--fail);font-weight:500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:28px;padding:0 11px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--raised);color:var(--text2);font-size:12.5px;font-weight:500;white-space:nowrap;transition:background .14s,border-color .14s,color .14s,transform .14s,box-shadow .14s}
.btn:hover{background:var(--raised2);border-color:var(--line3);color:var(--text)}
.btn:active{transform:translateY(.5px)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn-sm{height:24px;padding:0 8px;font-size:12px;gap:5px;border-radius:5px}
.btn-lg{height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#141204;font-weight:600}
.btn-primary:hover{background:#ffe03d;border-color:#ffe03d;color:#141204;box-shadow:0 0 0 3px rgba(255,212,0,.12)}
.btn-primary kbd{background:rgba(0,0,0,.1);border-color:rgba(0,0,0,.18);color:rgba(20,18,4,.62)}
.btn-light{background:#e6ebf2;border-color:#e6ebf2;color:#0a0e15;font-weight:600}
.btn-light:hover{background:#fff;border-color:#fff;color:#0a0e15}
.btn-ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn-ghost:hover{background:var(--raised2);border-color:var(--line2);color:var(--text)}
.btn-keep{background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.3);color:#7be8a9}
.btn-keep:hover{background:rgba(61,220,132,.18);border-color:rgba(61,220,132,.5);color:#a6f0c5}
.btn-undo:hover{border-color:rgba(255,92,92,.45);color:#ff9b9b;background:rgba(255,92,92,.08)}
.ib{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--r2);color:var(--dim);transition:background .14s,color .14s}
.ib:hover{background:var(--raised2);color:var(--text)}

/* app frame */
#app{display:grid;grid-template-rows:40px minmax(0,1fr) 24px;height:100vh}
.titlebar{display:flex;align-items:center;gap:10px;padding-left:12px;background:var(--bg);border-bottom:1px solid var(--line);min-width:0}
.tb-left{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.tb-logo{width:20px;height:20px;margin-right:4px}
.tb-btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:var(--r2);color:var(--text);font-weight:550;transition:background .14s}
.tb-btn:hover{background:var(--raised)}
.tb-btn .ic{color:var(--dim)}
.tb-branch{font:500 12px var(--mono);color:var(--text2);font-weight:500}
.tb-sep{color:var(--faint)}
.tb-search{display:flex;align-items:center;gap:8px;width:380px;height:28px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--dim);font-size:12.5px;transition:border-color .14s,background .14s}
.tb-search:hover{border-color:var(--line2);background:var(--raised);color:var(--text2)}
.tb-search span{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-search > .ic{flex:none}
.tb-right{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end;min-width:0}
.attn{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 10px 0 9px;border-radius:999px;border:1px solid rgba(255,176,32,.38);background:rgba(255,176,32,.08);color:#ffc65a;font-size:12px;font-weight:550;transition:background .14s,border-color .14s}
.attn:hover{background:rgba(255,176,32,.14);border-color:rgba(255,176,32,.6)}
.attn .pdot{width:7px;height:7px;border-radius:50%;background:var(--wait);box-shadow:0 0 0 0 rgba(255,176,32,.6);animation:attn 1.8s ease-out infinite}
.attn.clear{border-color:var(--line2);background:transparent;color:var(--dim)}
.attn.clear .pdot{background:var(--done);animation:none}
.win{display:flex;height:40px}
.win button{width:44px;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:background .14s,color .14s}
.win button:hover{background:var(--raised);color:var(--text)}
.win button.x:hover{background:#c42b1c;color:#fff}

.main{position:relative;display:grid;grid-template-columns:292px 236px minmax(0,1fr) 372px;min-height:0;min-width:0}
.main.no-right{grid-template-columns:292px 236px minmax(0,1fr) 0}
.rail{display:none}

/* agents column */
.col-agents{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.ag-top{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ag-top-h{display:flex;align-items:center;justify-content:space-between;padding:0 2px 2px}
.ag-top .btn-lg{width:100%;justify-content:flex-start}
.ag-top .btn-lg kbd,.ag-top .btn-lg .dots{margin-left:auto}
.btn-ask{height:32px}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:2px;display:block}
.ag-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 10px 14px}
.sec-h{display:flex;align-items:center;gap:8px;padding:14px 4px 8px}
.sec-h .ml{flex:none}
.sec-h .rule{flex:1;height:1px;background:var(--line)}
.s-working{--sc:var(--work)}.s-waiting{--sc:var(--wait)}.s-done{--sc:var(--done)}.s-merged,.s-closed{--sc:var(--merged)}.s-failed{--sc:var(--fail)}
.card{position:relative;padding:10px 12px 10px 14px;margin-bottom:6px;border:1px solid var(--line);border-radius:var(--r3);background:var(--raised);cursor:pointer;overflow:hidden;transition:border-color .15s,background .15s,box-shadow .15s}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc);opacity:.9}
.card:hover{border-color:var(--line2);background:#111823}
.card.sel{border-color:var(--line3);background:#121a26;box-shadow:0 10px 28px -14px rgba(0,0,0,.8),inset 0 0 0 1px rgba(255,255,255,.02)}
.card:last-child{margin-bottom:0}
.c1{display:flex;align-items:center;gap:8px}
.sdot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--sc);flex:none}
.s-working .sdot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1px solid var(--sc);animation:ping 1.7s ease-out infinite}
.c-title{flex:1;min-width:0;font-weight:560;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-time{font:11px var(--mono);color:var(--dim);flex:none}
.c2{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;min-width:0}
.cli{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-weight:500;flex:none}
.cli i{width:8px;height:8px;border-radius:2px;display:block}
.model{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.c-stats{margin-left:auto;font:11px var(--mono);color:var(--dim);flex:none;display:flex;gap:5px}
.c-wt{display:flex;align-items:center;gap:6px;margin-top:5px;font:11px var(--mono);color:var(--text2);min-width:0}
.c-wt .ic{color:var(--dim)}
.c-wt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-last{display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font:11.5px var(--mono);color:var(--dim);min-width:0}
.c-last span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.s-working .c-last span{color:#8fb1c9}
.shim{position:absolute;left:3px;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,rgba(76,195,255,.9),transparent) no-repeat;background-size:38% 100%;animation:shim 1.5s linear infinite}
.approve{margin-top:9px;padding:9px 10px 10px;border:1px solid rgba(255,176,32,.32);background:rgba(255,176,32,.055);border-radius:8px;cursor:default}
.ap-q{display:flex;gap:6px;align-items:center;color:#ffc65a;font-weight:560;font-size:12px}
.ap-cmd{display:block;margin:7px 0 9px;font:12px var(--mono);color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--line2);padding:5px 8px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-btns{display:flex;gap:6px;align-items:center}
.ap-btns .hint{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
.c-act{display:flex;gap:6px;margin-top:9px}
.grp{border:1px solid var(--line);border-radius:12px;background:rgba(10,14,21,.6);padding:8px;margin-bottom:8px;position:relative}
.grp-h{display:flex;align-items:center;gap:9px;padding:2px 2px 9px}
.grp-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--raised2);border:1px solid var(--line2);color:var(--text2);flex:none}
.grp-t{flex:1;min-width:0}
.grp-t b{display:block;font-weight:560;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-t span{display:block;font-size:11px;color:var(--dim)}
.grp .card{background:var(--raised)}
.mrow{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;color:var(--dim);cursor:pointer;transition:background .14s,color .14s}
.mrow:hover{background:var(--raised);color:var(--text2)}
.mrow.sel{background:var(--raised);color:var(--text)}
.mrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .tag{font:10.5px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}

/* files column */
.col-files{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.fl-head{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px 0 14px;border-bottom:1px solid var(--line)}
.fl-wt{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font:11px/1.45 var(--mono);color:var(--text2)}
.fl-wt .cmark{width:8px;height:8px;border-radius:2px;margin-top:4px;flex:none}
.fl-wt .p{display:block;color:var(--text)}
.fl-wt .sub{display:block;font-family:Inter;font-size:11px;color:var(--dim);margin-top:2px}
.fl-filter{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.switch{position:relative;width:28px;height:16px;border-radius:999px;background:var(--line2);transition:background .16s;flex:none}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#8a96a8;transition:transform .16s var(--ease),background .16s}
.switch.on{background:rgba(76,195,255,.4)}
.switch.on::after{transform:translateX(12px);background:#e6f6ff}
.tree{flex:1;overflow:auto;padding:6px 6px 14px}
.tr{display:flex;align-items:center;gap:6px;width:100%;height:24px;padding-right:8px;border-radius:5px;color:var(--text2);cursor:pointer;white-space:nowrap;text-align:left;transition:background .12s,color .12s}
.tr:hover{background:var(--raised);color:var(--text)}
.tr.sel{background:#132031;color:var(--text);box-shadow:inset 0 0 0 1px rgba(76,195,255,.18)}
.tr .chev{color:var(--dim);transition:transform .15s var(--ease)}
.tr .chev.open{transform:rotate(90deg)}
.tr .fi{color:#5d6a7e}
.tr .fo{color:#7f8ea5}
.tr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tr.mod .nm{color:var(--mod)}
.tr.new .nm{color:#6fe3a2}
.tr.heavy{opacity:.4}
.tr .cdot{width:5px;height:5px;border-radius:50%;background:var(--mod);opacity:.8}
.st{font:600 11px var(--mono);width:12px;text-align:center;flex:none}
.st-M{color:var(--mod)}.st-A{color:var(--done)}
.tnote{height:24px;display:flex;align-items:center;font-size:11.5px;color:var(--faint);white-space:nowrap}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--dim);font-size:12px;padding:28px 18px}
.empty .eic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--raised);color:var(--text2)}
.empty b{color:var(--text2);font-weight:550;font-size:12.5px}

/* center */
.col-center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.tabs{display:flex;align-items:stretch;height:36px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0;flex:none}
.tablist{display:flex;min-width:0;flex:1;overflow:hidden;container-type:inline-size}
@container (max-width:720px){.tab:not(.sel) .tt{display:none}.tab:not(.sel){flex:0 0 auto}}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:0 12px;min-width:0;flex:0 1 186px;border-right:1px solid var(--line);color:var(--dim);font-size:12.5px;transition:background .14s,color .14s}
.tab:hover{background:var(--raised);color:var(--text2)}
.tab.sel{background:#070a10;color:var(--text);margin-bottom:-1px}
.tab.sel::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--cc)}
.tab .tc{font-weight:600;flex:none}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11.5px}
.tab .sdot{width:6px;height:6px}
.tab-plus{width:36px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none;border-right:1px solid var(--line);transition:background .14s,color .14s}
.tab-plus:hover{background:var(--raised);color:var(--text)}
.tabs-r{display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--line);flex:none}
.tabs-r .ib.on{color:var(--text);background:var(--raised2)}
.center-body{flex:1;min-height:0;display:flex;flex-direction:column}
.term{flex:0 0 55%;min-height:0;display:flex;flex-direction:column;background:#070a10}
.term-strip{height:30px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);font-size:12px;flex:none;min-width:0}
.term-strip .cmd{font:11.5px var(--mono);color:var(--text2);white-space:nowrap}
.term-strip .wt{font:11.5px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:550;color:var(--sc);background:color-mix(in srgb,var(--sc) 11%,transparent);border:1px solid color-mix(in srgb,var(--sc) 30%,transparent);flex:none;white-space:nowrap}
.pill .sdot{width:6px;height:6px}
.term-scroll{flex:1;overflow:auto;padding:12px 16px 10px;font:12.5px/1.65 var(--mono);color:var(--text2)}
.tl{margin:1px 0;white-space:pre-wrap;word-break:break-word}
.tl-user{display:flex;gap:10px;margin:2px 0 10px;padding:7px 11px;background:var(--raised);border:1px solid var(--line);border-radius:7px;color:var(--text)}
.tl-user .pr{font-weight:700;flex:none}
.tl-text{position:relative;padding-left:16px;color:#c3ccd8;margin:6px 0 4px}
.tl-text::before{content:'';position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--cc)}
.tl-tool{display:flex;gap:8px;align-items:center;padding-left:16px;color:var(--dim)}
.tl-tool .p{color:#94a1b4}
.tl-tool .tc{color:var(--dim)}
.tl-run{display:inline-flex;gap:8px;align-items:center;margin:6px 0 3px 16px;padding:2px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--raised);color:var(--text)}
.tl-run .dl{color:var(--dim)}
.tl-out{color:#7f8b9d;margin-left:16px;padding-left:12px;border-left:1px solid var(--line2)}
.tl-ask{margin:8px 0 6px 16px;padding:9px 12px;border:1px solid rgba(255,176,32,.4);background:rgba(255,176,32,.07);border-radius:8px;color:#ffd58a}
.tl-ask .q{display:flex;gap:8px;align-items:center}
.tl-ask .ab{display:flex;gap:6px;align-items:center;margin-top:8px;font-family:Inter}
.tl-ask .ab span{font-size:11px;color:var(--dim);margin-left:6px}
.tl-ask .ans{font:11px Inter;color:var(--dim);margin-left:auto}
.tl-ask.answered{border-color:var(--line2);background:var(--raised);color:var(--text2)}
.tl-done{display:flex;gap:8px;align-items:center;padding-left:16px;color:var(--done);margin-top:6px}
.tl-merged{display:flex;gap:8px;align-items:center;padding-left:16px;color:var(--text2);margin-top:6px}
.tl-work{display:flex;gap:8px;align-items:center;padding-left:16px;color:var(--work);margin-top:6px}
.tl-work .el{color:var(--dim)}
.spin{animation:spin .9s linear infinite}
.term-input{display:flex;align-items:center;gap:9px;margin:0 12px 12px;padding:0 6px 0 12px;height:38px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);flex:none;transition:border-color .15s,box-shadow .15s}
.term-input:focus-within{border-color:rgba(76,195,255,.5);box-shadow:0 0 0 3px rgba(76,195,255,.08)}
.term-input .pr{font:700 13px var(--mono)}
.term-input input{flex:1;min-width:0;background:none;border:0;outline:0;font:12.5px var(--mono);color:var(--text)}
.term-input input::placeholder{color:var(--faint)}
.splitter{height:7px;margin:-3px 0;position:relative;z-index:5;cursor:row-resize;flex:none}
.splitter::after{content:'';position:absolute;left:0;right:0;top:3px;height:1px;background:var(--line);transition:background .14s}
.splitter:hover::after{background:rgba(76,195,255,.5)}
.filep{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.fp-head{height:34px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;min-width:0}
.crumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;min-width:0;flex:1}
.crumb b{color:var(--text);font-weight:550}
.crumb .sl{color:var(--faint)}
.by{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);padding:2px 7px;border:1px solid var(--line2);border-radius:999px;white-space:nowrap;flex:none}
.by i{width:6px;height:6px;border-radius:2px;display:block}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line2);border-radius:7px;background:var(--bg);flex:none}
.seg button{height:22px;padding:0 10px;border-radius:5px;font-size:12px;color:var(--dim);transition:background .14s,color .14s}
.seg button:hover{color:var(--text2)}
.seg button.on{background:var(--raised2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button[disabled]{opacity:.35;pointer-events:none}
.code-scroll{flex:1;overflow:auto;font:12.5px/20px var(--mono);padding:6px 0 64px;color:#cfd7e2}
.code-inner{display:inline-block;min-width:100%}
.ln{display:flex;height:20px;white-space:pre}
.ln .g{width:46px;flex:none;text-align:right;padding-right:10px;color:#354155;user-select:none}
.ln .mk{width:16px;flex:none;color:var(--faint);user-select:none}
.ln .cd{padding-right:28px}
.ln.add{background:var(--add-bg)}
.ln.add .mk{color:var(--done)}
.ln.add .g{color:#3d7458;box-shadow:inset -2px 0 rgba(61,220,132,.7)}
.ln.del{background:var(--del-bg)}
.ln.del .mk{color:var(--fail)}
.ln.del .g{color:#7d4a50;box-shadow:inset -2px 0 rgba(255,92,92,.7)}
.ln.del .cd{opacity:.72;text-decoration:line-through;text-decoration-color:rgba(255,92,92,.35)}
.ln.e-add .g{box-shadow:inset -3px 0 rgba(61,220,132,.75)}
.ln.e-mod .g{box-shadow:inset -3px 0 rgba(76,195,255,.75)}
.hunk{position:relative;transition:box-shadow .15s}
.hunk.cur{box-shadow:inset 3px 0 var(--work)}
.hbar{position:sticky;left:0;width:var(--codew,100%);display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 62px;border-bottom:1px solid var(--line)}
.hbar .lbl{font:11px var(--mono);color:var(--faint);margin-right:auto}
.hunk.cur .hbar .lbl{color:var(--work)}
.review{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;background:rgba(17,23,33,.94);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:11px;box-shadow:0 16px 36px -10px rgba(0,0,0,.8);white-space:nowrap;z-index:4}
.review .cnt{font-size:12px;color:var(--text2);padding:0 8px 0 6px}
.review .cnt b{color:var(--text);font-weight:600}
.review .vsep{width:1px;height:18px;background:var(--line2);margin:0 4px}
.review.done{color:var(--done);padding:6px 12px;gap:8px;font-size:12px}
.shell{height:0;overflow:hidden;transition:height .18s var(--ease);background:#070a10;border-top:1px solid transparent;flex:none;display:flex;flex-direction:column}
.shell.open{height:196px;border-top-color:var(--line)}
.sh-head{height:30px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);flex:none}
.sh-head .t{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:550}
.sh-head .p{font:11px var(--mono);color:var(--dim);flex:1}
.sh-body{flex:1;overflow:auto;padding:8px 14px;font:12px/1.6 var(--mono);color:#93a0b2;white-space:pre}
.sh-body .ok{color:var(--done)}
.sh-body .sh-url{color:#7aa2f7;text-decoration:underline;text-decoration-color:rgba(122,162,247,.4)}
.sh-body .ps{color:var(--dim)}
.sh-body .cmd{color:var(--text)}
.caret{display:inline-block;width:7px;height:14px;background:#7aa2f7;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}

/* right panel */
.col-right{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-left:1px solid var(--line)}
.main.no-right .col-right{display:none}
.rtabs{display:flex;height:36px;border-bottom:1px solid var(--line);padding:0 6px;gap:2px;align-items:stretch;flex:none}
.rtab{position:relative;padding:0 11px;color:var(--dim);font-size:12.5px;display:flex;align-items:center;gap:7px;transition:color .14s}
.rtab:hover{color:var(--text2)}
.rtab.on{color:var(--text)}
.rtab.on::after{content:'';position:absolute;left:9px;right:9px;bottom:-1px;height:2px;background:var(--text);border-radius:2px}
.rtab .n-chip{padding:1px 5px}
.rbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.pv-bar{display:flex;align-items:center;gap:2px;padding:7px 8px;flex:none}
.url{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:28px;margin:0 4px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);font:12px var(--mono);color:var(--text2)}
.url .live{width:6px;height:6px;border-radius:50%;background:var(--done);box-shadow:0 0 0 3px rgba(61,220,132,.14);flex:none}
.url span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url .host{color:var(--text)}
.pv-meta{display:flex;align-items:center;gap:8px;padding:0 12px 8px;font-size:11.5px;color:var(--dim);flex:none}
.pv-meta .cmark{width:7px;height:7px;border-radius:2px}
.pv-meta .mono{color:var(--text2);font-size:11px}
.pv-frame{flex:1;min-height:0;margin:0 10px 10px;border-radius:9px;overflow:auto;border:1px solid var(--line2);background:#fbfaf7;box-shadow:0 18px 40px -24px rgba(0,0,0,.9)}
.pv-frame.spin-in{animation:fadein .35s ease}
.site{--sb:#fbfaf7;--st:#1d1b17;--sl:#e7e2d8;--sd:#736d62;--sc:#ffffff;--acc:#b8432f;background:var(--sb);color:var(--st);min-height:100%;padding:16px 16px 20px;font-family:Georgia,'Times New Roman',serif;transition:background .3s ease,color .3s ease}
.site.dark{--sb:#111111;--st:#f4f4f4;--sl:#333333;--sd:#a39f97;--sc:#1a1a1a;--acc:#ef7a62}
.s-top{display:flex;align-items:center;justify-content:space-between;font-family:Inter,sans-serif;font-size:11px;color:var(--sd)}
.s-brand{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--st);letter-spacing:.01em}
.s-logo{width:16px;height:16px;border-radius:50%;background:#c0392b}
.s-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:18px;padding-bottom:12px;border-bottom:1px solid var(--sl);transition:border-color .3s}
.s-kick{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:5px;transition:color .3s}
.s-head h1{margin:0;font-size:25px;line-height:1.1;font-weight:400;letter-spacing:-.01em}
.s-toggle{display:inline-flex;align-items:center;gap:6px;font-family:Inter,sans-serif;font-size:11px;font-weight:500;padding:6px 10px;border:1px solid var(--sl);border-radius:999px;background:var(--sc);color:var(--st);transition:background .3s,color .3s,border-color .3s,box-shadow .14s;flex:none}
.s-toggle:hover{box-shadow:0 0 0 3px rgba(184,67,47,.14)}
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.s-card{display:flex;flex-direction:column;border:1px solid var(--sl);border-radius:10px;padding:10px 11px;background:var(--sc);transition:background .3s,border-color .3s}
.s-card h3{font-size:13.5px;margin:0 0 3px;font-weight:600;line-height:1.2}
.s-card p{font-family:Inter,sans-serif;font-size:10.5px;color:var(--sd);margin:0 0 9px;line-height:1.35;flex:1;transition:color .3s}
.s-card strong{font-family:Inter,sans-serif;font-size:12px;font-weight:600}
.s-foot{margin-top:14px;font-family:Inter,sans-serif;font-size:10px;color:var(--sd);display:flex;justify-content:space-between}
.chg{padding:6px 8px 14px}
.chg-g{margin-bottom:6px}
.chg-h{display:flex;align-items:center;gap:8px;padding:10px 6px 6px}
.chg-h .cmark{width:8px;height:8px;border-radius:2px;flex:none}
.chg-h b{font-weight:560;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chg-h .wt{font:11px var(--mono);color:var(--dim);margin-left:auto;white-space:nowrap}
.frow{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--text2);text-align:left;transition:background .12s,color .12s}
.frow:hover{background:var(--raised);color:var(--text)}
.frow.sel{background:#132031;color:var(--text)}
.frow .fn{white-space:nowrap}
.frow .fd{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.frow .nums{font:11px var(--mono);display:flex;gap:5px;flex:none}
.frow .act{opacity:0;transition:opacity .12s}
.frow:hover .act{opacity:1}
.git{padding:12px;display:flex;flex-direction:column;gap:10px}
.git-br{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:11.5px var(--mono);color:var(--text2)}
.git-br > span:not(.from){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.git-br .from{margin-left:auto;font-family:Inter;color:var(--dim);font-size:11px;white-space:nowrap;flex:none}
.git-sec{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0}
.git-list{display:flex;flex-direction:column}
.commit-box{border:1px solid var(--line2);border-radius:9px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
.commit-box:focus-within{border-color:rgba(76,195,255,.5);box-shadow:0 0 0 3px rgba(76,195,255,.08)}
.commit-box textarea{display:block;width:100%;min-height:92px;resize:none;padding:10px 11px;border:0;outline:0;background:transparent;font-size:12.5px;line-height:1.5;color:var(--text)}
.commit-box textarea::placeholder{color:var(--faint)}
.commit-row{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line)}
.commit-row .btn-light{margin-left:auto}
.ai-busy .ic{animation:spin .9s linear infinite}

/* status bar */
.statusbar{display:flex;align-items:center;gap:14px;padding:0 10px;font-size:11.5px;color:var(--dim);background:var(--bg);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;min-width:0}
.sb-i{display:inline-flex;align-items:center;gap:6px}
.sb-i b{color:var(--text2);font-weight:500}
.sb-sep{width:1px;height:12px;background:var(--line2)}
.sb-dot{width:6px;height:6px;border-radius:50%;background:var(--sc)}
.sb-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.meter{display:inline-flex;align-items:center;gap:6px}
.meter .bar{width:34px;height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:2px}
.meter .v{font:10.5px var(--mono);color:var(--text2)}
.ag-foot{flex:none;height:30px;display:flex;align-items:center;padding:0 12px;border-top:1px solid var(--line)}
.mock-label{font:500 10px/1 var(--mono);letter-spacing:.04em;color:#4d596b;padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--bg);pointer-events:none}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;background:rgba(3,5,9,.64);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;animation:fadein .14s ease}
.modal{margin-top:8vh;width:560px;max-width:calc(100vw - 32px);max-height:calc(100vh - 16vh);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 40px 90px -24px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.03);animation:pop .17s var(--ease);overflow:hidden}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px 18px;border-bottom:1px solid var(--line)}
.m-head .mi{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--raised2);border:1px solid var(--line2);color:var(--text);flex:none}
.m-head .tt{flex:1;min-width:0}
.m-title{font-size:15px;font-weight:600;letter-spacing:-.005em}
.m-sub{font-size:12.5px;color:var(--dim);margin-top:2px}
.m-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.m-foot{display:flex;align-items:center;gap:8px;padding:12px 16px 14px 18px;border-top:1px solid var(--line);background:rgba(6,8,13,.4)}
.m-foot .hint{margin-right:auto;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.cli-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clic{position:relative;padding:11px 11px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--raised);cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.clic:hover{border-color:var(--line3)}
.clic.on{border-color:color-mix(in srgb,var(--cc) 70%,transparent);background:color-mix(in srgb,var(--cc) 7%,var(--raised));box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 12%,transparent)}
.clic-h{display:flex;align-items:center;gap:8px;font-weight:600}
.clic-h .mk{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cc) 18%,transparent);color:var(--cc);font:700 11px var(--mono)}
.clic-h .ck{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;color:#0a0e15;transition:background .14s,border-color .14s}
.clic.on .ck{background:var(--cc);border-color:var(--cc)}
.clic .use{font-size:11px;color:var(--dim);margin-top:3px}
.sel-wrap{position:relative;margin-top:9px}
.sel-wrap select{appearance:none;width:100%;height:28px;padding:0 26px 0 9px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);font:12px var(--mono);color:var(--text);cursor:pointer}
.sel-wrap select:focus-visible{outline:2px solid rgba(76,195,255,.5)}
.sel-wrap .ic{position:absolute;right:7px;top:7px;color:var(--dim);pointer-events:none}
.field{display:flex;flex-direction:column;gap:7px}
.field textarea{min-height:84px;resize:none;padding:10px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);font-size:13px;line-height:1.5;color:var(--text);outline:0;transition:border-color .15s,box-shadow .15s}
.field textarea:focus{border-color:rgba(76,195,255,.5);box-shadow:0 0 0 3px rgba(76,195,255,.08)}
.field textarea::placeholder{color:var(--faint)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;transition:border-color .14s}
.opt:hover{border-color:var(--line2)}
.opt .ot{flex:1}
.opt .ot b{display:block;font-weight:550;font-size:12.5px}
.opt .ot span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.opt .switch{margin-top:2px}
.cbox{width:16px;height:16px;border-radius:4px;border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;color:#0a0e15;margin-top:1px;flex:none;transition:background .14s,border-color .14s}
.cbox.on{background:var(--work);border-color:var(--work)}
.mfile{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:12px var(--mono)}
.mfile .p{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfile .nums{display:flex;gap:6px;font-size:11px}
.mbar{display:flex;gap:1px;width:52px;height:6px;border-radius:2px;overflow:hidden;background:var(--line)}
.mbar i{display:block;height:100%}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.checks span{display:inline-flex;align-items:center;gap:6px}
.checks .ic{color:var(--done)}
.what{display:flex;gap:10px;padding:11px 12px;border-radius:10px;background:rgba(76,195,255,.06);border:1px solid rgba(76,195,255,.2);font-size:12.5px;color:#bfe6fb}
.what .ic{color:var(--work);margin-top:1px}
.what .s{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.pal{margin-top:11vh;width:620px}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--line)}
.pal-in .ic{color:var(--dim)}
.pal-in input{flex:1;background:none;border:0;outline:0;font-size:14px;color:var(--text)}
.pal-in input::placeholder{color:var(--faint)}
.pal-in .mode{font:10.5px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:2px 6px;text-transform:uppercase;letter-spacing:.08em}
.pal-list{max-height:380px;overflow:auto;padding:6px}
.pal-g{padding:10px 10px 5px}
.pi{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:7px;color:var(--text2);cursor:pointer}
.pi.on{background:var(--raised2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.pi .ic{color:var(--dim)}
.pi.on .ic{color:var(--text2)}
.pi .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .l b,.pi .d b{color:var(--work);font-weight:600}
.pi .d{font-size:11.5px;color:var(--dim);white-space:nowrap}
.pal-foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}
.pal-foot span{display:inline-flex;align-items:center;gap:5px}
.pal-empty{padding:26px;text-align:center;color:var(--dim);font-size:12.5px}
.cmp{position:fixed;inset:22px 22px 34px;z-index:101;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:0 40px 100px -20px rgba(0,0,0,.9);animation:pop .18s var(--ease);overflow:hidden}
.cmp-h{display:flex;align-items:center;gap:14px;padding:16px 16px 14px 20px;border-bottom:1px solid var(--line)}
.cmp-h .tt{flex:1;min-width:0}
.cmp-h .q{display:block;font:12px var(--mono);color:var(--text2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-legend{display:flex;gap:16px;font-size:11.5px;color:var(--dim)}
.cmp-cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}
.cc{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;transition:border-color .15s}
.cc.best{border-color:rgba(255,212,0,.28);box-shadow:0 0 0 1px rgba(255,212,0,.06)}
.cc-h{position:relative;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.cc-h::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--cc)}
.cc-h .r1{display:flex;align-items:center;gap:9px}
.cc-h .mk{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc);font:700 12px var(--mono);flex:none}
.cc-h .nm{font-weight:600;font-size:14px}
.cc-h .md{font-size:11.5px;color:var(--dim)}
.cc-h .wt{display:flex;align-items:center;gap:6px;margin-top:8px;font:11px var(--mono);color:var(--dim)}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:550;white-space:nowrap}
.tag.good{color:#ffe36b;background:rgba(255,212,0,.08);border:1px solid rgba(255,212,0,.25)}
.tag.neutral{color:var(--text2);background:var(--raised2);border:1px solid var(--line2)}
.tag.bad{color:#ff9090;background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.3)}
.tag.merged{color:var(--text2);background:var(--raised2);border:1px solid var(--line3)}
.cc-h .r1 .tag{margin-left:auto}
.cc-b{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.cc-sum{font-size:12.5px;line-height:1.55;color:#c3ccd8;margin:0}
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.met{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.met .k{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.met .v{font:600 14px var(--mono);margin-top:3px;white-space:nowrap}
.met .v.ok{color:var(--done)}.met .v.bad{color:#ff8a8a}
.met .v small{font-size:11px;font-weight:500}
.mini-diff{border:1px solid var(--line);border-radius:8px;background:#070a10;font:11.5px/19px var(--mono);overflow:auto;padding:4px 0}
.mini-diff .ln{height:19px}
.mini-diff .ln .g{width:34px;padding-right:8px}
.mini-diff .ln .mk{width:14px}
.mini-diff .gap{height:19px;padding-left:12px;color:var(--faint);font-size:11px}
.cc-files{display:flex;flex-direction:column;gap:4px}
.cc-files div{display:flex;align-items:center;gap:8px;font:11.5px var(--mono);color:var(--text2)}
.cc-files .nums{margin-left:auto;display:flex;gap:5px;font-size:11px}
.cc-f{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--panel)}
.cc-f .btn-primary{flex:1}
.toasts{position:fixed;right:14px;bottom:34px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;max-width:380px;padding:9px 14px 9px 11px;border:1px solid var(--line2);border-radius:10px;background:rgba(17,23,33,.97);color:var(--text);font-size:12.5px;box-shadow:0 18px 40px -12px rgba(0,0,0,.8);animation:toastin .2s var(--ease)}
.toast .ti{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:rgba(61,220,132,.14);color:var(--done);flex:none}
.toast.info .ti{background:rgba(76,195,255,.14);color:var(--work)}
.toast.out{animation:toastout .2s ease forwards}

@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes shim{0%{background-position:-40% 0}100%{background-position:140% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes attn{0%{box-shadow:0 0 0 0 rgba(255,176,32,.55)}70%{box-shadow:0 0 0 6px rgba(255,176,32,0)}100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(6px)}}
@keyframes flash{0%{background:rgba(76,195,255,.18)}100%{background:transparent}}

/* syntax */
.t-k{color:#8fb8ff}.t-s{color:#9fd8ad}.t-c{color:#56627a;font-style:italic}.t-n{color:#f2b980}.t-t{color:#6fd3e0}.t-p{color:#76839a}

@media (max-width:1360px){
  .main{grid-template-columns:280px 44px minmax(0,1fr) 340px}

      <div class="sel-wrap"><select data-model="${c}" aria-label="${NAMES[c]} model">${MODELS[c].map(m => `<option ${m === na.models[c] ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>${ic('chevD', 13)}</div>
    </div>`; }).join('');
  return `<div class="modal" role="dialog" aria-label="New agent" style="width:600px">
    <div class="m-head"><span class="mi">${ic('plus', 17)}</span><div class="tt"><div class="m-title">New agent</div><div class="m-sub">Give it a task. It works on its own while you watch.</div></div><button class="ib" data-act="closeOv" title="Close">${ic('x', 16)}</button></div>
    <div class="m-body">
      <div class="field"><span class="ml">Pick a CLI</span><div class="cli-cards">${cards}</div></div>
      <div class="field"><span class="ml">Task</span><textarea id="naTask" placeholder="What should it do? For example: add a specials banner with a slide-in."></textarea></div>
      <div class="opt" data-act="naCopy" role="switch" aria-checked="${na.copy}" tabindex="0"><div class="ot"><b>Work in its own copy of the project</b><span>Its edits stay apart from yours until you merge them.</span></div><span class="switch ${na.copy ? 'on' : ''}"></span></div>
      <div class="opt" data-act="naAll" role="checkbox" aria-checked="${na.all}" tabindex="0"><span class="cbox ${na.all ? 'on' : ''}">${na.all ? ic('check', 11) : ''}</span><div class="ot"><b>Send to all three and compare</b><span>Claude, Codex and Grok each try it in their own copy. You pick the best one.</span></div></div>
    </div>
    <div class="m-foot"><span class="hint"><kbd>Ctrl Enter</kbd> to start</span><button class="btn" data-act="closeOv">Cancel</button><button class="btn btn-primary" data-act="naCreate">${ic('play', 13)}${na.all ? 'Start 3 agents' : 'Start agent'}</button></div>
  </div>`;
}
function mergeHTML(a) {
  const fs = changedFiles(a.id), st = astats(a.id);
  const g = a.group && GROUPS[a.group], others = g ? g.members.filter(id => id !== a.id && byId(id).state === 'done').length : 0;
  return `<div class="modal" role="dialog" aria-label="Merge" style="width:540px">
    <div class="m-head"><span class="mi" style="color:var(--brand)">${ic('merge', 17)}</span><div class="tt"><div class="m-title">Merge ${NAMES[a.cli]} into main</div><div class="m-sub">${esc(a.title)} · <span class="mono" style="font-size:11.5px">${esc(wtName(a))}</span></div></div><button class="ib" data-act="closeOv" title="Close">${ic('x', 16)}</button></div>
    <div class="m-body">
      <div class="field"><span class="ml">Files to merge · ${fs.length}</span>
        ${fs.map(p => { const f = fstat(a.id, p), s = fileStatus(a.id, p), tot = f.add + f.del || 1;
          return `<div class="mfile"><span class="st st-${s}">${s}</span><span class="p">${esc(p)}</span><span class="nums"><b class="add">+${f.add}</b><b class="del">-${f.del}</b></span><span class="mbar"><i style="width:${f.add / tot * 100}%;background:var(--done)"></i><i style="width:${f.del / tot * 100}%;background:var(--fail)"></i></span></div>`; }).join('') || '<div class="tnote">No file changes</div>'}
      </div>
      <div class="checks"><span>${ic('flask', 14)}Tests ${a.tests ? a.tests[0] + ' of ' + a.tests[1] : 'not run'} passed</span><span>${ic('check', 14)}No conflicts with main</span><span>${ic('diff', 14)}<b class="add">+${st.add}</b> <b class="del">-${st.del}</b></span></div>
      <div class="what">${ic('copy', 16)}<span>Its copy is merged back into main, then the copy is cleaned up.${others ? `<span class="s">The other ${others} results for this task will be set aside.</span>` : ''}</span></div>
    </div>
    <div class="m-foot"><span class="hint">Nothing is pushed. You can still undo from Git.</span><button class="btn" data-act="closeOv">Cancel</button><button class="btn btn-primary" data-act="mergeConfirm" data-id="${a.id}">${ic('merge', 13)}Merge into main</button></div>
  </div>`;
}
function miniDiff(id, p) {
  const st = FS[id][p]; if (!st) return '';
  const lang = langOf(p);
  if (st.before === null) { const ls = st.after.split('\n').slice(0, 8); return ls.map((l, i) => lnHTML('add', i + 1, l, lang)).join(''); }
  const { a, b, hunks } = M.diff(st.before, st.after);
  if (!hunks.length) return `<div class="gap">No differences left</div>`;
  let out = '', shownTo = -1;
  hunks.forEach((h, k) => {
    const from = Math.max(h.bStart - 1, shownTo + 1);
    if (k > 0 && from > shownTo + 1) out += `<div class="gap">...</div>`;
    for (let i = from; i < h.bStart; i++) out += lnHTML('', i + 1, b[i], lang);
    for (let i = 0; i < h.aLen; i++) out += lnHTML('del', h.aStart + i + 1, a[h.aStart + i], lang);
    for (let i = 0; i < h.bLen; i++) out += lnHTML('add', h.bStart + i + 1, b[h.bStart + i], lang);
    const nb = h.bStart + h.bLen; if (nb < b.length - 1) { out += lnHTML('', nb + 1, b[nb], lang); shownTo = nb; } else shownTo = nb - 1;
  });
  return out;
}
function cmpHTML(gid) {
  const g = GROUPS[gid], ms = g.members.map(byId);
  if (g.fresh && ms.some(m => RANK[m.state] < 2)) return '';
  const merged = ms.find(m => m.state === 'merged');
  const cols = ms.map(m => {
    const fs = Object.keys(FS[m.id]).filter(p => rawStatus(m.id, p));
    const st = fs.reduce((t, p) => { const f = fstat(m.id, p, true); t.add += f.add; t.del += f.del; return t; }, { add: 0, del: 0 });
    const main = 'src/lib/pricing.ts' in FS[m.id] ? 'src/lib/pricing.ts' : fs[0];
    const pass = m.tests && m.tests[0] === m.tests[1];
    const best = !merged && g.best === m.id;
    const tag = m.state === 'merged' ? ['merged', 'Merged'] : m.state === 'closed' ? ['neutral', 'Set aside'] : (m.tag || ['neutral', 'Done']);
    return `<div class="cc ${best ? 'best' : ''}" style="--cc:${CLR[m.cli]}">
      <div class="cc-h"><div class="r1"><span class="mk">${NAMES[m.cli][0]}</span><div><div class="nm">${NAMES[m.cli]}</div><div class="md">${esc(m.model)} · took ${m.took || fmtAge(m)}</div></div><span class="tag ${tag[0]}">${tag[0] === 'good' ? ic('star', 11) : ''}${tag[1]}</span></div>
        <div class="wt">${ic('copy', 12)}${esc(wtName(m))}</div></div>
      <div class="cc-b">
        <div class="field"><span class="ml">Approach</span><p class="cc-sum">${esc(m.summary || '')}</p></div>
        <div class="mets">
          <div class="met"><div class="k">Tests</div><div class="v ${pass ? 'ok' : 'bad'}">${m.tests ? m.tests[0] + '/' + m.tests[1] : '-'}</div></div>
          <div class="met"><div class="k">Files</div><div class="v">${fs.length}</div></div>
          <div class="met"><div class="k">Lines</div><div class="v"><small class="add">+${st.add}</small> <small class="del">-${st.del}</small></div></div>
          <div class="met"><div class="k">Took</div><div class="v">${m.took || '-'}</div></div>
        </div>
        <div class="field"><span class="ml">Main change · ${esc(main ? main.split('/').pop() : '')}</span><div class="mini-diff"><div class="code-inner">${main ? miniDiff(m.id, main) : ''}</div></div></div>
        <div class="field"><span class="ml">Files</span><div class="cc-files">${fs.map(p => { const f = fstat(m.id, p, true), s = rawStatus(m.id, p);
          return `<div><span class="st st-${s}">${s}</span>${esc(p)}<span class="nums"><b class="add">+${f.add}</b><b class="del">-${f.del}</b></span></div>`; }).join('') || '<div>No file changes left</div>'}</div></div>
      </div>
      <div class="cc-f">${m.state === 'done' ? `<button class="btn btn-primary" data-act="mergeConfirm" data-id="${m.id}">${ic('merge', 14)}Merge this one</button>` : `<button class="btn" disabled style="flex:1">${STATE_LABEL[m.state]}</button>`}<button class="btn" data-act="cmpOpen" data-id="${m.id}">${ic('eye', 14)}Open</button></div>
    </div>`;
  }).join('');
  return `<div class="cmp" role="dialog" aria-label="Compare results">
    <div class="cmp-h"><span class="mi" style="width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--raised2);border:1px solid var(--line2)">${ic('columns', 17)}</span>
      <div class="tt"><div class="m-title">Compare results · ${esc(g.title)}</div><span class="q">&gt; ${esc(g.task)}</span></div>
      <div class="cmp-legend"><span>Same task, three copies.</span><span>Pick one to merge into main.</span></div>
      <button class="ib" data-act="closeOv" title="Close (Esc)">${ic('x', 16)}</button></div>
    <div class="cmp-cols">${cols}</div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (S.filesPop && !e.target.closest('.col-files,.rail')) { S.filesPop = false; $('#main').classList.remove('files-pop'); renderRail(); }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'sel': selectAgent(id); break;
    case 'review': selectAgent(id); S.right = 'changes'; if (S.rightHidden) toggleRight(); renderRight(); break;
    case 'file': openFile(el.dataset.path); break;
    case 'dir': S.open[el.dataset.path] = !S.open[el.dataset.path]; if (S.onlyChanged) { S.onlyChanged = false; S.open[el.dataset.path] = true; } renderTree(); break;
    case 'onlyChanged': S.onlyChanged = !S.onlyChanged; renderTree(); break;
    case 'view': S.view = el.dataset.v; renderFile(); break;
    case 'hkeep': hunkOp(+el.dataset.k, true); break;
    case 'hundo': hunkOp(+el.dataset.k, false); break;
    case 'keepall': fileAll(true); break;
    case 'undoall': fileAll(false); break;
    case 'hprev': case 'hnext': {
      const a = sel(), p = curPath(), st = FS[a.id][p]; if (fileStatus(a.id, p) !== 'M') break;
      const n = M.diff(st.before, st.after).hunks.length;
      S.hunk = (S.hunk + (act === 'hnext' ? 1 : n - 1)) % n;
      if (S.view !== 'diff') S.view = 'diff';
      renderFile(); scrollToHunk(); break;
    }
    case 'allow': answer(id, true); break;
    case 'deny': answer(id, false); break;
    case 'merge': S.ov = { type: 'merge', id }; renderOv(); break;
    case 'mergeConfirm': doMerge(id); break;
    case 'compare': {
      const g = GROUPS[el.dataset.g];
      if (g.members.some(m => RANK[byId(m).state] < 2)) toast('Compare opens when all three finish', 'info');
      else openCompare(el.dataset.g);
      break;
    }
    case 'cmpOpen': S.ov = null; renderOv(); selectAgent(id); break;
    case 'new': openNew(false); break;
    case 'askall': openNew(true); break;
    case 'naCli': if (e.target.closest('select')) break; S.na.cli = el.dataset.cli; S.na.all = false; S.na.task = $('#naTask').value; renderOv(); break;
    case 'naCopy': S.na.copy = !S.na.copy; S.na.task = $('#naTask').value; renderOv(); break;
    case 'naAll': S.na.all = !S.na.all; S.na.task = $('#naTask').value; renderOv(); break;
    case 'naCreate': S.na.task = $('#naTask').value; createAgents(); break;
    case 'closeOv': S.ov = null; renderOv(); break;
    case 'ovbg': if (e.target === el) { S.ov = null; renderOv(); } break;
    case 'palette': openPalette('cmd'); break;
    case 'gofile': openPalette('file'); break;
    case 'palrun': palRun(+el.dataset.k); break;
    case 'rtab': S.right = el.dataset.tab; if (S.rightHidden) toggleRight(); renderRight(); break;
    case 'chg': S.sel = id; S.fileBy[id] = el.dataset.path; S.hunk = 0; S.view = 'diff'; renderAll(); break;
    case 'pvdark': S.dark = !S.dark; { const site = document.querySelector('.site'); if (site) { site.classList.toggle('dark', S.dark); el.innerHTML = `${ic(S.dark ? 'sun' : 'moon', 13)}${S.dark ? 'Light mode' : 'Dark mode'}`; } } break;
    case 'pvreload': { const f = $('#pvFrame'); f.classList.remove('spin-in'); void f.offsetWidth; f.classList.add('spin-in'); el.querySelector('svg').classList.add('spin'); setTimeout(() => { const s = el.querySelector('svg'); if (s) s.classList.remove('spin'); }, 600); break; }
    case 'pvback': toast('No earlier page in this preview', 'info'); break;
    case 'pvopen': toast('Opened localhost:3000 in your browser'); break;
    case 'stage': gitState(S.sel).staged.add(el.dataset.path); renderRight(); break;
    case 'unstage': gitState(S.sel).staged.delete(el.dataset.path); renderRight(); break;
    case 'stageAll': changedFiles(S.sel).forEach(p => gitState(S.sel).staged.add(p)); renderRight(); break;
    case 'unstageAll': gitState(S.sel).staged.clear(); renderRight(); break;
    case 'aiMsg': aiMessage(); break;
    case 'commit': commit(); break;
    case 'shell': toggleShell(); break;
    case 'rightToggle': toggleRight(); break;
    case 'filesPop': S.filesPop = !S.filesPop; $('#main').classList.toggle('files-pop', S.filesPop); renderRail(); break;
    case 'attn': { const w = A.find(a => a.state === 'waiting'); if (w) { selectAgent(w.id); const c = document.querySelector(`.card[data-id="${w.id}"]`); if (c) c.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } else toast('Nothing needs you right now', 'info'); break; }
    case 'toast': toast(el.dataset.msg, 'info'); break;
    case 'noop': break;
  }
});
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-model]');
  if (s) { S.na.models[s.dataset.model] = s.value; if (!S.na.all) { S.na.cli = s.dataset.model; S.na.task = $('#naTask').value; renderOv(); } }
});
document.addEventListener('input', e => {
  if (e.target.id === 'palIn') { S.ov.q = e.target.value; S.ov.i = 0; renderPalList(); }
  if (e.target.id === 'commitMsg') S.commitMsg = e.target.value;
  if (e.target.id === 'naTask') S.na.task = e.target.value;
});
document.addEventListener('mousemove', e => {
  const pi = e.target.closest && e.target.closest('.pi');
  if (pi && S.ov && S.ov.type === 'pal' && +pi.dataset.k !== S.ov.i) { S.ov.i = +pi.dataset.k; document.querySelectorAll('.pi').forEach(x => x.classList.toggle('on', x === pi)); }
});
$('#termForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#termIn').value.trim(); if (!v) return;
  $('#termIn').value = ''; sendTerm(v);
});
document.addEventListener('keydown', e => {
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  if (S.ov && S.ov.type === 'pal' && e.target.id === 'palIn') {
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); const n = S.ov.items.length; if (n) { S.ov.i = (S.ov.i + (k === 'ArrowDown' ? 1 : n - 1)) % n; renderPalList(); } return; }
    if (k === 'Enter') { e.preventDefault(); palRun(S.ov.i); return; }
  }
  if (k === 'Escape') {
    if (S.ov) { S.ov = null; renderOv(); e.preventDefault(); return; }
    if (S.filesPop) { S.filesPop = false; $('#main').classList.remove('files-pop'); renderRail(); return; }
    if (S.shell) { toggleShell(); return; }
  }
  if (ctrl && k === 'Enter' && S.ov && S.ov.type === 'new') { e.preventDefault(); S.na.task = $('#naTask').value; createAgents(); return; }
  if (ctrl && (k === 'k' || k === 'K')) { e.preventDefault(); openPalette('cmd'); return; }
  if (ctrl && (k === 'p' || k === 'P')) { e.preventDefault(); openPalette('file'); return; }
  if (ctrl && (k === 'n' || k === 'N')) { e.preventDefault(); openNew(false); return; }
  if (ctrl && (e.code === 'Backquote' || k === '`')) { e.preventDefault(); toggleShell(); return; }
  if (ctrl && e.shiftKey && (k === 'V' || k === 'v')) { e.preventDefault(); CMDS['Toggle preview'](); return; }
  if ((k === 'Enter' || k === ' ') && !S.ov) {
    const el = e.target.closest && e.target.closest('[data-act][tabindex]');
    if (el && el.tagName !== 'BUTTON' && el.tagName !== 'INPUT') { e.preventDefault(); el.click(); }
  }
  if ((k === 'Enter' || k === ' ') && S.ov && S.ov.type === 'new') {
    const el = e.target.closest && e.target.closest('.clic,.opt');
    if (el) { e.preventDefault(); el.click(); }
  }
});

/* splitter drag */
(function () {
  const sp = $('#splitter'), body = $('#centerBody'), term = $('#term');
  let drag = false;
  sp.addEventListener('mousedown', e => { drag = true; e.preventDefault(); document.body.style.cursor = 'row-resize'; });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const r = body.getBoundingClientRect();
    const pct = Math.min(80, Math.max(25, (e.clientY - r.top) / r.height * 100));
    term.style.flexBasis = pct + '%';
  });
  window.addEventListener('mouseup', () => { if (drag) { drag = false; document.body.style.cursor = ''; } });
})();
window.addEventListener('resize', setCodeW);

/* live clock for working agents */
setInterval(() => {
  A.forEach(a => {
    if (a.state !== 'working') return;
    a.age++;
    document.querySelectorAll(`[data-age="${a.id}"],[data-age-term="${a.id}"]`).forEach(el => { el.textContent = fmtAge(a); });
  });
}, 1000);

renderStatic();
renderShell();
renderAll();
window.__vd = { S, A, FS, GROUPS };
})();
</script>
</body>
</html>
