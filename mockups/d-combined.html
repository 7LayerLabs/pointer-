/* ================= shared tokens ================= */
:root {
  --r1: 6px; --r2: 8px; --r3: 10px; --r4: 12px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --sbw: 264px; --dockw: 384px;
  --ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --code-fs: 13px; --code-lh: 22px;
  --fs: 14px; --tb-h: 44px; --row-h: 28px; --tab-h: 40px; --head-h: 44px;
}
@media (max-width: 1360px) { :root { --sbw: 240px; --dockw: 348px; } }
html[data-code="12"] { --code-fs: 12px; --code-lh: 20px; }
html[data-code="14"] { --code-fs: 14px; --code-lh: 23px; }
html[data-density="compact"] { --fs: 13px; --tb-h: 40px; --row-h: 24px; --tab-h: 34px; --head-h: 38px; }

/* ================= themes =================
   Every color lives here. Each block is a complete palette. */
[data-theme="mission"] {
  --bg: #06080d; --side: #0a0e15; --surf: #0f141d; --raised: #141b27; --hover: #1a2333;

  --acc: #4cc3ff;
  --pri: #ffd400; --pri-ink: #141204; --pri-hover: #ffe03d;
  --work: #4cc3ff; --wait: #ffb020; --wait-ink: #1a1405; --wait-tx: #ffc65a; --done: #3ddc84; --merged: #6b7789;
  --add: #3ddc84; --del: #ff5c5c; --mod: #e5b567;
  --addbg: rgba(61, 220, 132, .085); --addbg2: rgba(61, 220, 132, .16);
  --delbg: rgba(255, 92, 92, .085); --delbg2: rgba(255, 92, 92, .16);
  --add-code: #cfe9da; --del-code: #b9a2a8;
  --code: #cfd7e2; --ln: #3d4a5f; --code-bg: #070a10; --term-bg: #070a10; --term-tx: #c3ccd8;
  --t-k: #8fb8ff; --t-s: #9fd8ad; --t-c: #56627a; --t-n: #f2b980; --t-t: #6fd3e0; --t-p: #76839a;
  --focus: rgba(76, 195, 255, .55); --selbg: rgba(76, 195, 255, .28);
  --thumb: #1a2230; --thumb-h: #273349;
  --stage: #0a0e15; --frame-line: #233044; --frame-sh: 0 18px 40px -24px rgba(0, 0, 0, .9);
  --scrim: rgba(3, 5, 9, .64); --well: rgba(0, 0, 0, .28);
  --sh: 0 40px 90px -24px rgba(0, 0, 0, .85), 0 1px 0 rgba(255, 255, 255, .03) inset;
  --close: #c42b1c; --close-ink: #ffffff;
  --f-ts: #7aa2f7; --f-css: #c49ae8; --f-md: #a9b4c4; --f-json: #e5b567; --f-xml: #ff8a7a;
  --lbl-ff: var(--mono); --lbl-fs: 10.5px; --lbl-ls: .1em; --lbl-fw: 500;

}
[data-theme="night"] {

  --line: #1d1f25; --line2: #2b2e37; --line3: #3a3e49;
  --tx: #e8e9ed; --tx2: #b3b6bf; --tx3: #7f838e; --tx4: #545864;
  --acc: #ffd400;
  --pri: #ffd400; --pri-ink: #141100; --pri-hover: #ffe04d;
  --work: #6ea8fe; --wait: #ffd400; --wait-ink: #141100; --wait-tx: #ffe36b; --done: #73c991; --merged: #545864;
  --add: #73c991; --del: #f0716b; --mod: #e2c08d;
  --addbg: rgba(115, 201, 145, .10); --addbg2: rgba(115, 201, 145, .18);
  --delbg: rgba(240, 113, 107, .10); --delbg2: rgba(240, 113, 107, .18);
  --add-code: #d4d6dc; --del-code: #c2a9a8;
  --code: #d4d6dc; --ln: #464a55; --code-bg: #060708; --term-bg: #060708; --term-tx: #c9ccd4;
  --t-k: #c49cf0; --t-s: #9fd3c7; --t-c: #5c6370; --t-n: #f2a272; --t-t: #7fb4f0; --t-p: #8a8f9c;
  --focus: rgba(255, 212, 0, .7); --selbg: rgba(255, 212, 0, .22);
  --thumb: #22242b; --thumb-h: #30333c;
  --stage: #0b0c0f; --frame-line: #2b2e37; --frame-sh: 0 12px 32px rgba(0, 0, 0, .5);
  --scrim: rgba(4, 4, 6, .6); --well: rgba(0, 0, 0, .3);
  --sh: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 50px rgba(0, 0, 0, .55), 0 4px 14px rgba(0, 0, 0, .35);
  --close: #c42b1c; --close-ink: #ffffff;
  --f-ts: #6ea8fe; --f-css: #b392f0; --f-md: #8b93a1; --f-json: #c9a46c; --f-xml: #e39a6b;

[data-theme="studio"] {
  --bg: #121110; --side: #161513; --surf: #1c1a18; --raised: #23211e; --hover: #282521;
  --line: #2a2724; --line2: #36322d; --line3: #4a443d;
  --tx: #ece7df; --tx2: #b9b2a7; --tx3: #857e74; --tx4: #5f5952;
  --acc: #ffd400;
  --pri: #ffd400; --pri-ink: #191400; --pri-hover: #ffe042;
  --work: #8fbf8a; --wait: #ffd400; --wait-ink: #1a1500; --wait-tx: #ffd400; --done: #b9b2a7; --merged: #5f5952;
  --add: #8fbf8a; --del: #d98b7a; --mod: #d9b36c;
  --addbg: rgba(143, 191, 138, .12); --addbg2: rgba(143, 191, 138, .2);
  --delbg: rgba(217, 139, 122, .12); --delbg2: rgba(217, 139, 122, .2);
  --add-code: #ddd6cb; --del-code: #cdb4ab;
  --code: #ddd6cb; --ln: #5f5952; --code-bg: #151413; --term-bg: #100f0e; --term-tx: #d6cfc4;
  --t-k: #e3a874; --t-s: #b9c48c; --t-c: #7c746a; --t-n: #e09a8c; --t-t: #9db7cc; --t-p: #8f877c;
  --focus: rgba(255, 212, 0, .6); --selbg: rgba(255, 212, 0, .22);
  --thumb: #2f2b27; --thumb-h: #3d3833;
  --stage: #161513; --frame-line: #36322d; --frame-sh: 0 10px 30px rgba(0, 0, 0, .35);
  --scrim: rgba(8, 7, 6, .55); --well: rgba(0, 0, 0, .25);
  --sh: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 18px 50px rgba(0, 0, 0, .45), 0 4px 14px rgba(0, 0, 0, .3);
  --close: #b5503f; --close-ink: #ffffff;
  --f-ts: #8ea9c4; --f-css: #c49ac0; --f-md: #b9b2a7; --f-json: #d9b36c; --f-xml: #d98b7a;

/* smooth 200ms color change when a theme is applied */
html.theming *, html.theming *::before, html.theming *::after {
  transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease, fill .2s ease, stroke .2s ease, outline-color .2s ease !important;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--tx); }
body { font: var(--fs)/1.55 var(--ui); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s12 { width: 12px; height: 12px; }
svg.i.s14 { width: 14px; height: 14px; }
svg.i.s18 { width: 18px; height: 18px; }
svg.i.s20 { width: 20px; height: 20px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: var(--r1); }
input:focus-visible, textarea:focus-visible { outline: none; }
[hidden] { display: none !important; }
::selection { background: var(--selbg); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--thumb-h); background-clip: padding-box; border: 3px solid transparent; }
::-webkit-scrollbar-corner { background: transparent; }
.kbd { font: 500 11px/1 var(--mono); color: var(--tx3); background: var(--raised); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 3px 5px 2px; white-space: nowrap; }
.mono { font-family: var(--mono); }
.lbl { font-family: var(--lbl-ff); font-size: var(--lbl-fs); letter-spacing: var(--lbl-ls); font-weight: var(--lbl-fw); text-transform: uppercase; line-height: 1.2; }

/* ---------- app frame ---------- */
#app { height: 100vh; display: grid; grid-template-rows: var(--tb-h) 1fr 26px; }

.titlebar { position: relative; display: flex; align-items: center; background: var(--bg); border-bottom: 1px solid var(--line); padding-left: 14px; user-select: none; min-width: 0; }
.tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.tb-left .logo { width: 20px; height: 20px; display: block; }
.tb-proj { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tx); font-weight: 550; padding: 4px 8px; border-radius: var(--r2); transition: background .15s; }
.tb-proj:hover { background: var(--surf); }
.tb-proj .sep { color: var(--tx4); font-weight: 400; }
.tb-proj .br { color: var(--tx3); font-weight: 450; display: flex; align-items: center; gap: 5px; }
.cmdfield { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: clamp(340px, 34vw, 540px); height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 12px; background: var(--surf); border: 1px solid var(--line2); border-radius: var(--r3); color: var(--tx3); font-size: 13px; transition: border-color .15s, background .15s, box-shadow .15s; }
.cmdfield:hover { border-color: var(--line3); background: var(--raised); color: var(--tx2); }
.cmdfield:focus-visible { outline: none; border-color: color-mix(in srgb, var(--acc) 70%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 14%, transparent); }
.cmdfield .ph { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; height: 100%; }
.agents-pill { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: var(--surf); font-size: 12.5px; color: var(--tx2); transition: border-color .15s, background .15s, color .15s; white-space: nowrap; }
.agents-pill:hover { border-color: var(--line3); color: var(--tx); }
.agents-pill .dots { display: flex; gap: 4px; }
.agents-pill.attn { border-color: color-mix(in srgb, var(--wait) 40%, transparent); background: color-mix(in srgb, var(--wait) 8%, transparent); color: var(--wait-tx); }
.agents-pill.attn:hover { border-color: color-mix(in srgb, var(--wait) 65%, transparent); background: color-mix(in srgb, var(--wait) 14%, transparent); }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--tx4); display: inline-block; flex: none; }
.sdot.working { background: var(--work); animation: pulse 1.8s var(--ease) infinite; }
.sdot.waiting { background: var(--wait); }
.sdot.done { background: var(--done); }
.sdot.merged { background: var(--merged); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--work) 55%, transparent); } 70% { box-shadow: 0 0 0 5px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.iconbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: var(--r2); color: var(--tx3); transition: background .15s, color .15s; flex: none; }
.iconbtn:hover { background: var(--raised); color: var(--tx); }
.iconbtn.on { color: var(--tx); }
.winctl { display: flex; height: 100%; margin-left: 6px; }
.winctl button { width: 44px; height: 100%; display: grid; place-items: center; color: var(--tx3); transition: background .12s, color .12s; }
.winctl button:hover { background: var(--surf); color: var(--tx); }
.winctl button.x:hover { background: var(--close); color: var(--close-ink); }

.main { display: grid; grid-template-columns: 48px var(--sbw) minmax(0, 1fr) var(--dockw); min-height: 0; min-width: 0; }
.main.nodock { grid-template-columns: 48px var(--sbw) minmax(0, 1fr) 0; }
.main.anim { transition: grid-template-columns .18s var(--ease); }

/* ---------- activity bar ---------- */
.activity { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
.act { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r3); color: var(--tx3); transition: background .15s, color .15s; }
.act:hover { color: var(--tx); background: var(--surf); }
.act.on { color: var(--tx); }
.act.on::before { content: ''; position: absolute; left: -6px; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--acc); }
.act .badge { position: absolute; top: 4px; right: 3px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; font: 650 9.5px/15px var(--ui); text-align: center; background: var(--raised); color: var(--tx2); border: 1px solid var(--line2); }
.act .badge.y { background: var(--wait); color: var(--wait-ink); border-color: transparent; }
.activity .spacer { flex: 1; }

/* ---------- sidebar ---------- */
.sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.sb-head { height: var(--head-h); flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; }
.sb-head h2 { margin: 0; color: var(--tx3); flex: 1; white-space: nowrap; }
.sb-body { flex: 1; overflow: auto; padding: 0 8px 64px; min-height: 0; }
.sb-sec { color: var(--tx4); padding: 14px 8px 6px; display: flex; align-items: center; gap: 8px; }
.sb-sec .n { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--tx3); font: 500 11.5px var(--ui); }

.tr { display: flex; align-items: center; gap: 7px; height: var(--row-h); padding-left: calc(8px + var(--d) * 14px); padding-right: 8px; border-radius: var(--r1); color: var(--tx2); font-size: 13.5px; cursor: pointer; white-space: nowrap; transition: background .12s, color .12s; user-select: none; }
html[data-density="compact"] .tr { font-size: 12.5px; }
.tr:hover { background: var(--surf); color: var(--tx); }
.tr.on { background: var(--raised); color: var(--tx); }
.tr .chev { width: 14px; display: grid; place-items: center; color: var(--tx4); transition: transform .15s var(--ease); }
.tr .chev.open { transform: rotate(90deg); }
.tr .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.tr .st { font: 600 11px/1 var(--mono); width: 14px; text-align: center; }
.st.M { color: var(--mod); } .st.A { color: var(--add); } .st.D { color: var(--del); }
.tr .fdot { width: 5px; height: 5px; border-radius: 50%; background: var(--mod); opacity: .7; margin-right: 4px; }
.tr.heavy { opacity: .42; }
.tr.note { color: var(--tx4); font-size: 12px; cursor: default; font-style: italic; }
.tr.note:hover { background: none; }
.ficon { color: var(--tx3); }
.ficon.ts, .ficon.tsx { color: var(--f-ts); } .ficon.css { color: var(--f-css); } .ficon.md { color: var(--f-md); } .ficon.json { color: var(--f-json); } .ficon.xml, .ficon.svg { color: var(--f-xml); }

.sb-input { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; margin: 0 8px 8px; background: var(--surf); border: 1px solid var(--line2); border-radius: var(--r2); color: var(--tx3); transition: border-color .15s, box-shadow .15s; }
.sb-input:focus-within { border-color: color-mix(in srgb, var(--acc) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 10%, transparent); }
.sb-input input { flex: 1; min-width: 0; background: none; border: 0; color: var(--tx); font-size: 13.5px; }
.sb-meta { font-size: 12px; color: var(--tx3); padding: 2px 16px 8px; }
.sr-file { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; border-radius: var(--r1); color: var(--tx); font-size: 13px; cursor: pointer; }
.sr-file:hover { background: var(--surf); }
.sr-file .dir { color: var(--tx4); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.sr-file .cnt { font-size: 11px; color: var(--tx3); background: var(--raised); border-radius: 9px; padding: 0 7px; line-height: 18px; }
.sr-line { display: flex; gap: 10px; padding: 4px 8px 4px 30px; border-radius: var(--r1); font: 12.5px/1.5 var(--mono); color: var(--tx2); cursor: pointer; white-space: nowrap; overflow: hidden; }
.sr-line:hover { background: var(--surf); color: var(--tx); }
.sr-line .ln { color: var(--tx4); min-width: 18px; text-align: right; }
.sr-line .tx { overflow: hidden; text-overflow: ellipsis; }
.sr-line mark { background: color-mix(in srgb, var(--acc) 20%, transparent); color: var(--tx); border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--acc) 25%, transparent); }

/* git */
.commit-box { margin: 0 8px 4px; background: var(--surf); border: 1px solid var(--line2); border-radius: var(--r3); padding: 10px; transition: border-color .15s, box-shadow .15s; }
.commit-box:focus-within { border-color: color-mix(in srgb, var(--acc) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 8%, transparent); }
.commit-box textarea { width: 100%; background: none; border: 0; resize: none; font-size: 13px; line-height: 1.5; color: var(--tx); height: 58px; display: block; }
.commit-box textarea::placeholder { color: var(--tx4); }
.commit-row { display: flex; gap: 8px; margin-top: 8px; }
.git-row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: var(--r1); font-size: 13px; color: var(--tx2); cursor: pointer; transition: background .12s; }
html[data-density="compact"] .git-row, html[data-density="compact"] .sr-file { height: 26px; font-size: 12.5px; }
.git-row:hover { background: var(--surf); color: var(--tx); }
.git-row .nm { color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.git-row .nm.grow { flex: 1; }
.git-row .dir { color: var(--tx4); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.git-row .acts { display: none; gap: 2px; }
.git-row:hover .acts { display: flex; }
.git-row:hover .nums { display: none; }
.git-row .acts button { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--tx3); }
.git-row .acts button:hover { background: var(--raised); color: var(--tx); }
.nums { font: 500 11.5px/1 var(--mono); display: flex; gap: 6px; white-space: nowrap; }
.nums .p { color: var(--add); } .nums .m { color: var(--del); }
.empty-note { margin: 6px 8px; padding: 14px; border: 1px dashed var(--line2); border-radius: var(--r3); color: var(--tx3); font-size: 12.5px; text-align: center; }
.cp-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: var(--r1); font-size: 12.5px; color: var(--tx2); cursor: pointer; }
.cp-row:hover { background: var(--surf); }
.cp-row .when { margin-left: auto; color: var(--tx4); white-space: nowrap; }
.cp-row .rail { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--tx3); margin-top: 6px; flex: none; }

/* agents list (Mission Control style) */
.sec-h { display: flex; align-items: center; gap: 8px; padding: 14px 4px 8px; color: var(--tx3); }
.sec-h .rule { flex: 1; height: 1px; background: var(--line); }
.sec-h.wait { color: var(--wait-tx); }
.s-working { --sc: var(--work); } .s-waiting { --sc: var(--wait); } .s-done { --sc: var(--done); } .s-merged { --sc: var(--merged); }
.agc { position: relative; display: block; padding: 10px 10px 10px 13px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: var(--r3); background: var(--surf); cursor: pointer; overflow: hidden; transition: border-color .15s, background .15s, box-shadow .15s; }
html[data-density="compact"] .agc { padding: 8px 9px 8px 12px; margin-bottom: 5px; }
.agc::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--sc); opacity: .9; }
.agc:hover { border-color: var(--line2); background: var(--raised); }
.agc.sel { border-color: var(--line3); background: var(--raised); box-shadow: 0 10px 28px -16px rgba(0, 0, 0, .8); }
.agc:last-child { margin-bottom: 0; }
.c1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.adot { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--sc); flex: none; }
.s-working .adot::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 1px solid var(--sc); animation: ping 1.7s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.c-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 560; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-merged .c-title { color: var(--tx3); }
.c-time { font: 11px var(--mono); color: var(--tx3); flex: none; }
.c2 { display: flex; align-items: center; gap: 7px; margin-top: 5px; font-size: 12px; min-width: 0; }
.cli { display: inline-flex; align-items: center; gap: 6px; color: var(--tx2); font-weight: 500; flex: none; }
.cli i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.model { color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.c-stats { font: 11px var(--mono); color: var(--tx3); flex: none; display: flex; gap: 5px; }
.c-stats .p { color: var(--add); } .c-stats .m { color: var(--del); }
.c-wt { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 11px var(--mono); color: var(--tx2); min-width: 0; }
.c-wt svg { color: var(--tx3); }
.c-wt span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-last { display: flex; align-items: center; gap: 7px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font: 11.5px var(--mono); color: var(--tx3); min-width: 0; }
.c-last svg { flex: none; }
.c-last span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.s-working .c-last span { color: color-mix(in srgb, var(--work) 55%, var(--tx2)); }
.shim { position: absolute; left: 3px; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--work), transparent) no-repeat; background-size: 38% 100%; animation: cshim 1.5s linear infinite; opacity: .9; }
@keyframes cshim { 0% { background-position: -40% 0; } 100% { background-position: 140% 0; } }
.approve { margin-top: 9px; padding: 9px 10px 10px; border: 1px solid color-mix(in srgb, var(--wait) 34%, transparent); background: color-mix(in srgb, var(--wait) 6%, transparent); border-radius: var(--r2); cursor: default; }
.ap-q { display: flex; gap: 6px; align-items: center; color: var(--wait-tx); font-weight: 560; font-size: 12px; }
.ap-cmd { display: block; margin: 7px 0 9px; font: 12px var(--mono); color: var(--tx); background: var(--well); border: 1px solid var(--line2); padding: 5px 8px; border-radius: var(--r1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ap-btns { display: flex; gap: 6px; align-items: center; }
.ap-btns .hint { margin-left: auto; font-size: 11px; color: var(--tx3); white-space: nowrap; }
.grp { border: 1px solid var(--line); border-radius: var(--r4); background: color-mix(in srgb, var(--bg) 55%, var(--side)); padding: 8px; margin-bottom: 8px; position: relative; }
.grp-h { display: flex; align-items: flex-start; gap: 9px; padding: 2px 2px 8px; }
.grp-cmp { margin-top: 8px; }
.mrow .md { color: var(--tx3); margin-left: 4px; }
.mrow .mt.bad { color: color-mix(in srgb, var(--del) 80%, white); border-color: color-mix(in srgb, var(--del) 35%, transparent); }
.grp-ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--line2); color: var(--tx2); flex: none; }
.grp-t { flex: 1; min-width: 0; }
.grp-t b { display: block; font-weight: 560; font-size: 12.5px; line-height: 1.35; color: var(--tx); }
.grp-t span { display: block; font-size: 11px; color: var(--tx3); white-space: nowrap; }
.mrow { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: var(--r2); color: var(--tx3); cursor: pointer; transition: background .14s, color .14s; font-size: 12.5px; }
.mrow:hover { background: var(--raised); color: var(--tx2); }
.mrow.sel { background: var(--raised); color: var(--tx); }
.mrow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .mt { font: 10.5px var(--mono); color: var(--tx3); border: 1px solid var(--line2); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
.mrow .adot { background: var(--sc); }
.grp .agc { background: var(--surf); }
.cli-dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 6px; background: color-mix(in srgb, var(--tx) 5%, transparent); border: 1px solid var(--line2); color: var(--tx3); white-space: nowrap; }
.icon-tag { padding: 0 5px; }
.check-ic { color: var(--done); }
.merge-ic { color: var(--merged); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: var(--r2); font-size: 13px; font-weight: 550; color: var(--tx2); background: var(--raised); border: 1px solid var(--line2); transition: background .15s, color .15s, border-color .15s, transform .1s, box-shadow .15s; white-space: nowrap; }
.btn:hover { color: var(--tx); background: var(--hover); border-color: var(--line3); }
.btn:active { transform: translateY(.5px); }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--raised); }
.btn.primary { background: var(--pri); color: var(--pri-ink); border-color: var(--pri); }
.btn.primary:hover { background: var(--pri-hover); border-color: var(--pri-hover); color: var(--pri-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pri) 14%, transparent); }
.btn.light { background: var(--tx); color: var(--bg); border-color: var(--tx); }
.btn.light:hover { background: color-mix(in srgb, var(--tx) 85%, white); border-color: color-mix(in srgb, var(--tx) 85%, white); color: var(--bg); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12.5px; border-radius: 7px; gap: 6px; }
.btn.xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; gap: 5px; }
.btn.full { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.danger:hover { color: var(--del); }
.btn.pressed { color: var(--tx); border-color: color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--acc) 12%, transparent); }
html[data-density="compact"] .btn { height: 28px; font-size: 12.5px; }
html[data-density="compact"] .btn.sm { height: 24px; font-size: 12px; }
html[data-density="compact"] .btn.xs { height: 22px; }

/* ---------- center / editor ---------- */
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.editors { flex: 1; display: flex; min-height: 0; }
.group { display: flex; flex-direction: column; min-width: 0; min-height: 0; flex: 1; }
.group.ed { container-type: inline-size; }
.lbl2 .short { display: none; }
@container (max-width: 820px) { .toolbar .by-chip .bt { display: none; } .toolbar .by-chip { padding: 0 7px; } }
@container (max-width: 690px) { .crumbs .pre { display: none; } }
@container (max-width: 600px) { .toolbar .by-chip, .toolbar .tb-sep.s1 { display: none; } }
@container (max-width: 520px) { .toolbar .tbtn .bl { display: none; } .toolbar .tbtn { padding: 0 7px; } .lbl2 .full { display: none; } .lbl2 .short { display: inline; } .toolbar .tb-sep { display: none; } .toolbar { gap: 6px; padding-left: 14px; } }
@container (max-width: 420px) { .toolbar .crumbs { display: none; } .toolbar .chgnav { margin-right: auto; } }
.tabs { height: var(--tab-h); flex: none; display: flex; align-items: stretch; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; font-size: 13px; color: var(--tx3); border-right: 1px solid var(--line); cursor: pointer; white-space: nowrap; transition: color .12s, background .12s; flex: none; }
.tab:hover { color: var(--tx2); background: color-mix(in srgb, var(--surf) 50%, transparent); }
.tab.on { color: var(--tx); background: var(--bg); }
.tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--acc); }
.tab .x { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; color: var(--tx4); }
.tab .x:hover { background: var(--raised); color: var(--tx); }
.tab .x .stdot { width: 7px; height: 7px; border-radius: 50%; }
.tab .x .stdot.M { background: var(--mod); } .tab .x .stdot.A { background: var(--add); }
.tab .x .xi { display: none; }
.tab:hover .x .xi, .tab.on .x .xi { display: block; }
.tab:hover .x .stdot, .tab.on .x .stdot { display: none; }
.toolbar { height: var(--tab-h); flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--line); background: var(--bg); min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--tx3); min-width: 0; overflow: hidden; white-space: nowrap; flex: 1; }
.crumbs .last { color: var(--tx); font-weight: 500; flex: none; }
.crumbs svg { color: var(--tx4); }
.by-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tx3); padding: 0 8px; height: 24px; border-radius: 6px; background: color-mix(in srgb, var(--tx) 4%, transparent); border: 1px solid var(--line); white-space: nowrap; }
.tb-sep { width: 1px; height: 18px; background: var(--line2); flex: none; }
.chgnav { display: flex; align-items: center; gap: 2px; font-size: 12.5px; color: var(--tx2); white-space: nowrap; }
.chgnav .lbl2 { padding: 0 6px; font-variant-numeric: tabular-nums; }
.chgnav button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--tx3); }
.chgnav button:hover { background: var(--raised); color: var(--tx); }
.btn.on-preview { color: var(--tx); border-color: color-mix(in srgb, var(--acc) 40%, transparent); background: color-mix(in srgb, var(--acc) 12%, transparent); }

.editor-scroll { flex: 1; overflow: auto; min-height: 0; padding: 14px 0 120px; font: var(--code-fs)/var(--code-lh) var(--mono); position: relative; }
.code { min-width: max-content; }
.row { display: flex; min-height: var(--code-lh); position: relative; }
.row .ln { width: 56px; flex: none; text-align: right; padding-right: 18px; color: var(--ln); user-select: none; font-size: calc(var(--code-fs) - 1px); }
.row .mk { width: 14px; flex: none; color: transparent; user-select: none; }
.row .cd { white-space: pre; padding-right: 40px; color: var(--code); flex: 1; }
.row:hover .ln { color: var(--tx3); }
.row.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--acc) 14%, transparent); } 100% { background: transparent; } }
.blk { position: relative; margin: 2px 0; }
.blk::before { content: ''; position: absolute; left: 50px; top: 0; bottom: 0; width: 2px; border-radius: 2px; background: var(--line2); transition: background .15s; }
.blk.focus::before { background: var(--acc); }
.blk .row.del { background: var(--delbg); }
.blk .row.del .cd { color: var(--del-code); }
.blk .row.del .mk { color: var(--del); }
.blk .row.add { background: var(--addbg); }
.blk .row.add .cd { color: var(--add-code); }
.blk .row.add .mk { color: var(--add); }
.blk .row.del .cd span { opacity: .8; }
.blk-row { position: sticky; left: 0; width: calc(100cqw - 12px); height: 32px; display: flex; align-items: center; z-index: 1; }
.blk-row .gut { width: 70px; flex: none; }
.blk-bar { display: inline-flex; align-items: center; gap: 2px; padding: 3px; background: var(--raised); border: 1px solid var(--line2); border-radius: 9px; font-family: var(--ui); opacity: .88; transition: opacity .15s, border-color .15s; }
.blk:hover .blk-bar, .blk.focus .blk-bar { opacity: 1; border-color: var(--line3); }
.blk-bar button { display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; color: var(--tx2); transition: background .12s, color .12s; }
.blk-bar button:hover { background: var(--hover); color: var(--tx); }
.blk-bar button.keep { color: var(--add); }
.blk-bar button.keep:hover { background: var(--addbg2); }
.blk-bar button.undo:hover { color: var(--del); background: var(--delbg2); }
.blk-bar .bk { font: 500 11px var(--ui); color: var(--tx4); padding: 0 8px 0 6px; border-left: 1px solid var(--line2); margin-left: 4px; }
.blk.newfile::before { background: var(--add); opacity: .5; }
.new-banner { margin: 0 18px 12px 56px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r3); border: 1px solid color-mix(in srgb, var(--add) 25%, transparent); background: var(--addbg); font: 13px/1.4 var(--ui); color: var(--tx2); }
.new-banner svg { color: var(--add); }
.new-banner b { color: var(--tx); font-weight: 600; }

.t-k { color: var(--t-k); } .t-s { color: var(--t-s); } .t-c { color: var(--t-c); font-style: italic; } .t-n { color: var(--t-n); } .t-t { color: var(--t-t); } .t-p { color: var(--t-p); }

.welcome { flex: 1; display: grid; place-items: center; color: var(--tx3); }
.welcome .in { text-align: center; max-width: 380px; }
.welcome h3 { margin: 16px 0 6px; color: var(--tx); font-size: 17px; font-weight: 600; }
.welcome .keys { margin-top: 22px; display: grid; grid-template-columns: 1fr auto; gap: 10px 26px; text-align: left; font-size: 13px; }

/* ---------- preview (lives in the dock) ---------- */
.pv { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.pv-bar { height: 40px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; border-bottom: 1px solid var(--line); background: var(--side); }
.pv-url { flex: 1; min-width: 0; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 10px; margin: 0 4px; border-radius: var(--r2); background: var(--surf); border: 1px solid var(--line); font: 12px var(--mono); color: var(--tx2); white-space: nowrap; overflow: hidden; }
.pv-url svg { color: var(--tx4); }
.pv-url .host { color: var(--tx); }
.pv-url .ldot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--add); box-shadow: 0 0 0 3px color-mix(in srgb, var(--add) 16%, transparent); flex: none; }
.pv-stage { flex: 1; min-height: 0; padding: 10px; background: var(--stage); position: relative; }
.pv-frame { height: 100%; border-radius: var(--r3); overflow: hidden; border: 1px solid var(--frame-line); box-shadow: var(--frame-sh); position: relative; background: #fbf8f3; container-type: inline-size; }
.pv-load { position: absolute; left: 0; top: 0; height: 2px; background: var(--acc); width: 0; z-index: 3; }
.pv-load.go { animation: load .7s var(--ease) forwards; }
@keyframes load { 0% { width: 0; opacity: 1; } 80% { width: 100%; opacity: 1; } 100% { width: 100%; opacity: 0; } }

/* the rendered website (the user's app, not the IDE theme) */
.site { --s-bg: #fbf8f3; --s-card: #ffffff; --s-tx: #1d1915; --s-tx2: #6e655b; --s-line: #e8e1d6; --s-acc: #b5462f; --s-ink: #ffffff; height: 100%; overflow: auto; background: var(--s-bg); color: var(--s-tx); font-family: var(--ui); transition: background .3s, color .3s; }
.site.dark { --s-bg: #141210; --s-card: #1d1a17; --s-tx: #f4efe7; --s-tx2: #a99f93; --s-line: #33302b; --s-acc: #f0a24f; }
.site .nav { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-bottom: 1px solid var(--s-line); font-size: 12px; color: var(--s-tx2); }
.site .nav .mark { width: 22px; height: 22px; border-radius: 50%; background: var(--s-acc); display: grid; place-items: center; color: var(--s-ink); font: 700 11px/1 Georgia, serif; }
.site .nav b { color: var(--s-tx); font-size: 13px; font-weight: 650; }
.site .nav .links { margin-left: auto; display: flex; gap: 14px; }
.site .nav span { white-space: nowrap; }
.site .hero { padding: 26px 22px 8px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.site .hero .eyebrow { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--s-acc); font-weight: 700; }
.site h1 { font: 600 28px/1.1 Georgia, 'Times New Roman', serif; margin: 6px 0 4px; letter-spacing: -.01em; }
.site .hero p { margin: 0; font-size: 12.5px; color: var(--s-tx2); }
.site .theme-toggle { margin-left: auto; height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--s-line); background: var(--s-card); color: var(--s-tx); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: background .2s, border-color .2s, transform .1s; flex: none; }
.site .theme-toggle:hover { border-color: var(--s-acc); }
.site .theme-toggle:active { transform: scale(.97); }
.site .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 16px 22px 26px; }
.site .card { border: 1px solid var(--s-line); border-radius: 12px; padding: 14px 14px 12px; background: var(--s-card); display: flex; flex-direction: column; gap: 4px; transition: background .3s, border-color .3s; }
.site .card h3 { margin: 0; font: 600 15px/1.25 Georgia, serif; }
.site .card p { margin: 0; font-size: 12px; color: var(--s-tx2); line-height: 1.45; flex: 1; }
.site .card strong { margin-top: 8px; font-size: 13.5px; color: var(--s-acc); font-variant-numeric: tabular-nums; }
.site .foot { padding: 0 22px 22px; font-size: 11px; color: var(--s-tx2); }
@container (max-width: 460px) { .site .nav .links, .site .nav .sub { display: none; } .site .hero { padding: 20px 16px 4px; } .site .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 14px 16px 20px; gap: 10px; } .site .nav { padding: 12px 16px; } .site .foot { padding: 0 16px 16px; } .site h1 { font-size: 24px; } .site .card { padding: 12px 12px 10px; } .site .card h3 { font-size: 14px; } }

/* ---------- terminal panel ---------- */
.terminal { flex: none; height: 250px; border-top: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; min-height: 0; }
.term-tabs { height: 36px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px 0 10px; border-bottom: 1px solid var(--line); overflow: hidden; }
.term-tab { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--tx3); transition: background .12s, color .12s; white-space: nowrap; }
.term-tab:hover { color: var(--tx); background: var(--surf); }
.term-tab.on { color: var(--tx); background: var(--raised); }
.term-tabs .sp { flex: 1; }
.term-body { flex: 1; overflow: auto; padding: 10px 18px 16px; font: 12.5px/20px var(--mono); color: var(--term-tx); white-space: pre-wrap; min-height: 0; background: var(--term-bg); }
.rl { min-height: 20px; }
.rl.user { color: var(--tx); }
.rl.user .pr { color: var(--acc); }
.rl.dim { color: var(--tx4); }
.rl.tool { color: var(--tx2); }
.rl.tool .fn { color: var(--t-t); }
.rl.ok { color: var(--add); }
.rl.ask { color: var(--wait-tx); }
.rl.out { color: var(--tx3); }
.rl .p { color: var(--add); } .rl .m { color: var(--del); }
.caret { display: inline-block; width: 8px; height: 15px; background: var(--tx2); vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- dock (tabbed: Agent, Preview, Changes) ---------- */
.dock { container-type: inline-size; position: relative; background: var(--side); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.main.nodock .dock { border-left: 0; }
.dock-resize { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 8; }
.dock-resize::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .15s; }
.dock-resize:hover::after, .dock-resize.drag::after { background: color-mix(in srgb, var(--acc) 70%, transparent); }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
body.resizing-v, body.resizing-v * { cursor: row-resize !important; user-select: none !important; }
.dock-head { height: var(--head-h); flex: none; display: flex; align-items: stretch; gap: 2px; padding: 0 6px 0 8px; border-bottom: 1px solid var(--line); position: relative; background: var(--bg); }
.dtab { position: relative; display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 13px; font-weight: 550; color: var(--tx3); white-space: nowrap; transition: color .12s; border-radius: 0; }
.dtab:hover { color: var(--tx); }
.dtab:hover::before { content: ''; position: absolute; inset: 7px 2px; border-radius: var(--r2); background: var(--surf); z-index: -1; }
.dtab { z-index: 0; }
.dtab.on { color: var(--tx); }

.dtab .live { width: 6px; height: 6px; border-radius: 50%; background: var(--add); box-shadow: 0 0 0 0 color-mix(in srgb, var(--add) 55%, transparent); animation: live 2s ease-out infinite; }
@keyframes live { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--add) 55%, transparent); } 70% { box-shadow: 0 0 0 5px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.dtab .cnt { font: 600 10.5px/16px var(--mono); min-width: 18px; padding: 0 5px; border-radius: 8px; background: var(--raised); color: var(--tx2); border: 1px solid var(--line2); text-align: center; }
.dtab .cnt.y { background: var(--wait); color: var(--wait-ink); border-color: transparent; }
.dock-head .sp { flex: 1; min-width: 0; }
@container (max-width: 370px) { .split-btn .bl { display: none; } .split-btn { padding: 0 6px; } .dtab { padding: 0 8px; } }
@container (max-width: 340px) { .dtab { padding: 0 6px; gap: 5px; } }
.dock-head .tools { display: flex; align-items: center; gap: 4px; }
.split-btn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12.5px; font-weight: 550; color: var(--tx3); border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s; white-space: nowrap; }
.split-btn:hover { background: var(--raised); color: var(--tx); }
.split-btn.on { color: var(--tx); border-color: color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--acc) 12%, transparent); }
.dock-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.part { display: flex; flex-direction: column; min-height: 0; }
.part.ag { flex: 1; }
.part.pvp { flex: 0 0 var(--pvh, 50%); }
.hdiv { flex: none; height: 9px; cursor: row-resize; position: relative; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.hdiv::after { content: ''; position: absolute; left: 50%; top: 3px; width: 36px; height: 2px; margin-left: -18px; border-radius: 2px; background: var(--line3); transition: background .15s, width .15s, margin .15s; }
.hdiv:hover::after, .hdiv.drag::after { background: var(--acc); width: 56px; margin-left: -28px; }
.ag-bar { height: 44px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--line); position: relative; }

.switcher { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px; border-radius: var(--r2); transition: background .12s; text-align: left; }

.switcher svg { color: var(--tx3); }
.dock-sub { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--tx3); min-width: 0; }
.dock-sub .meta { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
.switch { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--tx3); font-size: 12px; white-space: nowrap; flex: none; padding: 2px 4px; border-radius: 6px; }
.switch:hover { color: var(--tx2); }
.switch .trk { width: 28px; height: 16px; border-radius: 8px; background: var(--line2); position: relative; transition: background .15s; }
.switch .trk::after { content: ''; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--tx2); transition: transform .16s var(--ease), background .16s; }
.switch.on .trk { background: color-mix(in srgb, var(--acc) 38%, transparent); }
.switch.on .trk::after { transform: translateX(12px); background: var(--acc); }
.switch.on { color: var(--tx); }
.menu { position: absolute; z-index: 30; background: var(--raised); border: 1px solid var(--line2); border-radius: var(--r4); box-shadow: var(--sh); padding: 6px; animation: pop .14s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.985); } to { opacity: 1; transform: none; } }
.menu .mi { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r2); cursor: pointer; font-size: 13px; color: var(--tx2); }

.menu .mi.sel { color: var(--tx); background: var(--surf); }

.convo { flex: 1; overflow: auto; padding: 18px 18px 24px; min-height: 0; }
.split .convo { padding: 14px 16px 16px; }
.msg-user { display: flex; justify-content: flex-end; margin: 4px 0 16px; }
.bubble { max-width: 86%; background: var(--raised); border: 1px solid var(--line2); border-radius: 14px 14px 4px 14px; padding: 9px 13px; font-size: 13.5px; line-height: 1.5; color: var(--tx); }

.tool-row { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px; margin: 0 0 6px; border-radius: var(--r2); background: var(--surf); border: 1px solid var(--line); font-size: 12.5px; color: var(--tx2); text-align: left; transition: background .12s, border-color .12s; }

.tool-row:hover { background: var(--raised); border-color: var(--line2); color: var(--tx); }
.tool-row svg { color: var(--tx3); }
.tool-row .vb { color: var(--tx3); flex: none; }
.tool-row .pth { font-family: var(--mono); font-size: 12px; color: var(--tx); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tool-row .nums { margin-left: auto; padding-left: 8px; }

.tool-group { margin: 2px 0 14px; }
.run { margin: 0 0 14px; border-radius: var(--r2); border: 1px solid var(--line); background: var(--surf); overflow: hidden; }

.run-out { margin: 0; padding: 8px 12px 9px; border-top: 1px solid var(--line); font: 12px/1.6 var(--mono); color: var(--tx3); white-space: pre-wrap; background: var(--well); }
.done-row { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 14px; padding: 10px 12px; border-radius: var(--r3); background: var(--addbg); border: 1px solid color-mix(in srgb, var(--add) 24%, transparent); font-size: 13.5px; line-height: 1.55; color: var(--tx); }
.done-row svg { color: var(--add); margin-top: 3px; }
.note-row { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 12.5px; color: var(--tx3); }
.note-row svg { color: var(--tx3); }
.working { display: flex; align-items: center; gap: 10px; margin: 6px 0 4px; font-size: 13px; color: var(--tx3); }
.shimmer { background: linear-gradient(90deg, var(--tx3) 0%, var(--tx) 45%, var(--tx3) 90%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 2.2s linear infinite; font-weight: 500; }
@keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.working .el { margin-left: auto; font-size: 12px; color: var(--tx4); font-variant-numeric: tabular-nums; }
.acard { border-radius: var(--r4); border: 1px solid var(--line2); background: var(--surf); padding: 14px; margin: 6px 0 14px; }
.acard.ask { border-color: color-mix(in srgb, var(--wait) 40%, transparent); background: linear-gradient(180deg, color-mix(in srgb, var(--wait) 7%, transparent), color-mix(in srgb, var(--wait) 2%, transparent)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--wait) 4%, transparent); }
.acard .ch { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; color: var(--tx); }
.acard.ask .ch svg { color: var(--wait); }
.acard .cmd { margin: 10px 0 8px; padding: 9px 11px; border-radius: var(--r2); background: var(--well); border: 1px solid var(--line); font: 12.5px var(--mono); color: var(--tx); }

.composer { flex: none; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.split .composer { padding: 8px 12px 12px; }
.comp-box { border: 1px solid var(--line2); background: var(--surf); border-radius: var(--r4); padding: 10px 10px 8px 12px; transition: border-color .15s, box-shadow .15s; }
.comp-box:focus-within { border-color: color-mix(in srgb, var(--acc) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 8%, transparent); }
.comp-box textarea { width: 100%; background: none; border: 0; resize: none; font-size: 13.5px; line-height: 1.5; color: var(--tx); height: 42px; display: block; }
.split .comp-box textarea { height: 22px; }
.comp-box textarea::placeholder { color: var(--tx4); }
.comp-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11.5px; color: var(--tx4); min-width: 0; }
.comp-row .chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--raised); color: var(--tx3); font-size: 11.5px; white-space: nowrap; }
.send { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--raised); color: var(--tx4); transition: background .15s, color .15s, transform .1s; flex: none; }

.dock-empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--tx3); font-size: 13px; padding: 30px; }

/* changes tab */
.chg { flex: 1; overflow: auto; min-height: 0; padding: 4px 8px 24px; }

.chg-grp { margin-top: 10px; }
.chg-gh { display: flex; align-items: center; gap: 8px; padding: 8px 8px 6px; font-size: 12.5px; color: var(--tx2); min-width: 0; }
.chg-gh b { font-weight: 600; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chg-gh .who { color: var(--tx3); white-space: nowrap; }
.chg-gh .nums { margin-left: auto; }
.chg-row { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 10px; border-radius: var(--r2); font-size: 13px; color: var(--tx2); cursor: pointer; transition: background .12s, color .12s; width: 100%; text-align: left; }

.chg-row:hover { background: var(--surf); color: var(--tx); }

.chg-row .nm { color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: none; max-width: 52%; }

.chg-row .st { font: 600 11px var(--mono); width: 12px; text-align: center; flex: none; }
.chg-note { margin: 14px 6px 0; padding: 12px; border-radius: var(--r3); border: 1px solid var(--line); background: var(--surf); font-size: 12.5px; color: var(--tx3); line-height: 1.5; }
.chg-note b { color: var(--tx2); font-weight: 600; }

/* ---------- status bar ---------- */
.statusbar { display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--side); border-top: 1px solid var(--line); font-size: 12px; color: var(--tx3); white-space: nowrap; overflow: hidden; }
.sbi { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; transition: background .12s, color .12s; }
button.sbi:hover { background: var(--surf); color: var(--tx); }
.sbi.on { color: var(--tx); background: var(--surf); }
.statusbar .sp { flex: 1; }
.meter { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.meter .bar { width: 30px; height: 4px; border-radius: 2px; background: var(--line2); overflow: hidden; }

.mock-label { position: fixed; left: 58px; bottom: 34px; z-index: 5; font-size: 11px; color: var(--tx3); padding: 3px 8px; border-radius: 6px; background: color-mix(in srgb, var(--bg) 82%, transparent); border: 1px solid var(--line); pointer-events: none; letter-spacing: .02em; }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); backdrop-filter: blur(3px); animation: fade .15s var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.palette { position: fixed; z-index: 51; left: 50%; top: 64px; transform: translateX(-50%); width: min(660px, calc(100vw - 48px)); background: var(--surf); border: 1px solid var(--line2); border-radius: 14px; box-shadow: var(--sh); overflow: hidden; animation: pop .16s var(--ease); }
.pal-in { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--tx3); }
.pal-in input { flex: 1; background: none; border: 0; font-size: 16px; color: var(--tx); min-width: 0; }
.pal-in input::placeholder { color: var(--tx4); }
.pal-list { max-height: min(430px, calc(100vh - 220px)); overflow: auto; padding: 6px 8px 8px; }
.pal-g { color: var(--tx4); padding: 10px 10px 5px; }
.pal-i { display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 10px; border-radius: var(--r2); cursor: pointer; font-size: 13.5px; color: var(--tx2); position: relative; }

.pal-i:hover { background: color-mix(in srgb, var(--raised) 60%, transparent); }
.pal-i svg { color: var(--tx3); }
.pal-i.sel { background: var(--raised); color: var(--tx); }
.pal-i.sel::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--acc); }
.pal-i.sel svg { color: var(--tx); }
.pal-i .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-i .lb .dim { color: var(--tx4); margin-left: 8px; font-size: 12.5px; }
.pal-i .lb b { color: var(--acc); font-weight: 600; }
.pal-i.start { color: var(--tx); }
.pal-i.start .q { color: var(--tx); font-weight: 500; }
.pal-i .ent { font-size: 11.5px; color: var(--tx4); }
.pal-i .sw { display: inline-flex; gap: 3px; }
.pal-i .sw i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(255, 255, 255, .08); }
.pal-foot { display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--tx4); }
.pal-foot span { display: flex; align-items: center; gap: 6px; }
.pal-empty { padding: 14px 10px 6px; font-size: 12.5px; color: var(--tx4); }

.modal { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(600px, calc(100vw - 48px)); max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--surf); border: 1px solid var(--line2); border-radius: 16px; box-shadow: var(--sh); animation: popc .17s var(--ease); }
@keyframes popc { from { opacity: 0; transform: translate(-50%, -48%) scale(.985); } to { opacity: 1; transform: translate(-50%, -50%); } }
.mh { display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 4px 22px; }
.mh h3 { margin: 0; font-size: 16px; font-weight: 600; color: var(--tx); }
.mh p { margin: 4px 0 0; font-size: 13px; color: var(--tx3); }
.mh .iconbtn { margin-left: auto; margin-top: -4px; }
.mb { padding: 14px 22px 4px; overflow: auto; min-height: 0; }
.mf { display: flex; align-items: center; gap: 8px; padding: 14px 20px 18px 22px; }
.mf .hint { font-size: 12px; color: var(--tx3); margin-right: auto; display: flex; align-items: center; gap: 6px; }
.mf .hint.ok svg { color: var(--add); }
.flabel { color: var(--tx3); margin: 0 0 8px; }
.cli-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.cli-card { position: relative; text-align: left; border: 1px solid var(--line2); background: var(--side); border-radius: var(--r4); padding: 12px; transition: border-color .15s, background .15s, box-shadow .15s; cursor: pointer; }
.cli-card:hover { border-color: var(--line3); background: var(--raised); }
.cli-card.sel { border-color: color-mix(in srgb, var(--acc) 65%, transparent); background: var(--raised); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 8%, transparent); }
.cli-card .top { display: flex; align-items: center; gap: 9px; }
.cli-card .mk { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 12px/1 var(--ui); color: #ffffff; }
.cli-card .nm { font-size: 14px; font-weight: 600; }
.cli-card .rd { margin-left: auto; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line2); display: grid; place-items: center; transition: border-color .15s; }
.cli-card.sel .rd { border-color: var(--acc); }
.cli-card.sel .rd::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
.cli-card .ds { font-size: 12px; color: var(--tx3); margin: 6px 0 10px; line-height: 1.4; min-height: 34px; }
.sel-wrap { position: relative; }
.sel-wrap select { appearance: none; width: 100%; height: 30px; padding: 0 28px 0 10px; border-radius: var(--r2); background: var(--surf); border: 1px solid var(--line2); color: var(--tx); font-size: 12.5px; cursor: pointer; }
.sel-wrap select:focus-visible { outline: 2px solid var(--focus); }
.sel-wrap svg { position: absolute; right: 8px; top: 8px; color: var(--tx3); pointer-events: none; }
.task-box { width: 100%; height: 92px; resize: none; padding: 11px 13px; border-radius: var(--r3); background: var(--side); border: 1px solid var(--line2); font-size: 14px; line-height: 1.55; color: var(--tx); display: block; transition: border-color .15s, box-shadow .15s; }
.task-box:focus { border-color: color-mix(in srgb, var(--acc) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 10%, transparent); }
.task-box.bad { border-color: color-mix(in srgb, var(--del) 70%, transparent); }
.task-box::placeholder { color: var(--tx4); }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
.opt:first-of-type { border-top: 0; }
.opt .ot { font-size: 13.5px; color: var(--tx); font-weight: 500; }
.opt .od { font-size: 12.5px; color: var(--tx3); margin-top: 1px; }
.opt .switch { margin-left: auto; margin-top: 2px; }
.opts { margin-top: 12px; }
.chk { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line2); display: grid; place-items: center; flex: none; margin-top: 1px; transition: background .15s, border-color .15s; color: var(--pri-ink); }
.chk.on { background: var(--pri); border-color: var(--pri); }
.chk svg { opacity: 0; } .chk.on svg { opacity: 1; }

.mdiff { border: 1px solid var(--line); border-radius: var(--r3); overflow: hidden; background: var(--code-bg); font: 12px/20px var(--mono); }
.mdiff .dl { display: flex; white-space: pre; }
.mdiff .dl .s { width: 22px; text-align: center; flex: none; color: var(--tx4); }
.mdiff .dl .c { overflow: hidden; text-overflow: ellipsis; padding-right: 10px; color: var(--code); }
.mdiff .dl.a { background: var(--addbg); } .mdiff .dl.a .s { color: var(--add); }
.mdiff .dl.d { background: var(--delbg); } .mdiff .dl.d .s { color: var(--del); } .mdiff .dl.d .c { color: var(--del-code); }

/* ---------------- editor ---------------- */
function hl(line, lang) { return line === '' ? '' : M.highlight(line, lang === 'css' ? 'css' : lang); }
function rowHtml(cls, ln, mark, code, lang) { return `<div class="row ${cls}" ${ln ? `data-ln="${ln}"` : ''}><span class="ln">${ln || ''}</span><span class="mk">${mark}</span><span class="cd">${hl(code, lang)}</span></div>`; }
function editorBody(p) {
  const f = M.files[p], lang = f.lang; let h = '', ln = 1;
  const c = S.changes[p];
  if (!c || !isChanged(p) && !c.isNew) {
    const lines = fileText(p).split('\n'); if (lines[lines.length - 1] === '') lines.pop();
    lines.forEach(l => { h += rowHtml('', ln++, '', l, lang); });
    return h;
  }
  if (c.isNew) {
    const lines = c.b.slice(); if (lines[lines.length - 1] === '') lines.pop();
    if (c.st[0] === 'p') {
      h += `<div class="new-banner">${I('filePlus')}<span><b>New file</b> written by ${cliName(c.by)}. Keep it or undo to remove it.</span></div>`;
      h += `<div class="blk newfile">` + lines.map(l => rowHtml('add', ln++, '+', l, lang)).join('') + '</div>';
    } else lines.forEach(l => { h += rowHtml('', ln++, '', l, lang); });
    return h;
  }
  const { a, b, hunks } = c.d; let bi = 0, pi = 0;
  const pendIdx = c.st.map((s, i) => s === 'p' ? i : -1).filter(i => i >= 0);
  const cur = pendIdx[Math.min(S.navIdx[p] || 0, pendIdx.length - 1)];
  const rows = [];
  hunks.forEach((hk, i) => {
    while (bi < hk.bStart) rows.push(rowHtml('', ln++, '', b[bi++], lang));
    const st = c.st[i];
    if (st === 'p') {
      let blk = `<div class="blk ${i === cur ? 'focus' : ''}" data-blk="${i}">`; const bar = `<div class="blk-row"><span class="gut"></span><div class="blk-bar"><button class="undo" data-act="undoBlk" data-path="${esc(p)}" data-i="${i}" title="Undo this change">${I('undo', 's14')}Undo</button><button class="keep" data-act="keepBlk" data-path="${esc(p)}" data-i="${i}" title="Keep this change">${I('check', 's14')}Keep</button><span class="bk">${pi + 1} of ${pendIdx.length}</span></div></div>`;
      a.slice(hk.aStart, hk.aStart + hk.aLen).forEach(l => { blk += rowHtml('del', 0, '-', l, lang); });
      b.slice(hk.bStart, hk.bStart + hk.bLen).forEach(l => { blk += rowHtml('add', ln++, '+', l, lang); });
      rows.push(blk + bar + "</div>"); pi++;
    } else if (st === 'k') b.slice(hk.bStart, hk.bStart + hk.bLen).forEach(l => rows.push(rowHtml('', ln++, '', l, lang)));
    else a.slice(hk.aStart, hk.aStart + hk.aLen).forEach(l => rows.push(rowHtml('', ln++, '', l, lang)));
    bi += hk.bLen;
  });
  while (bi < b.length) { const l = b[bi]; if (!(bi === b.length - 1 && l === '')) rows.push(rowHtml('', ln++, '', l, lang)); bi++; }
  return rows.join('');
}

function parseTool(t) {
  const m = /^(Read|Write|Edit)\s+(\S+)(?:\s+\(([^)]*)\))?/.exec(t);
  if (!m) return { verb: t, path: '', add: 0, del: 0 };
  const a = /\+(\d+)/.exec(m[3] || ''), d = /-(\d+)/.exec(m[3] || '');
  return { kind: m[1], verb: { Read: 'Read', Write: 'Created', Edit: 'Edited' }[m[1]], path: m[2], add: a ? +a[1] : 0, del: d ? +d[1] : 0, hasNums: !!m[3] };
}

  let h = `<div class="rl dim">${esc(head[0])}</div><div class="rl dim">${esc(head[1])}</div><div class="rl"> </div>`;

    else if (k === 'run') h += `<div class="rl tool">  <span class="fn">Run</span>(${esc(t)})</div>`;
    else if (k === 'out') h += `<div class="rl out">    ${esc(t.trim())}</div>`;

function compactDiff(before, after) {

  hunks.forEach((hk, i) => {
    if (i > 0) h += `<div class="dl gap"><span class="s"></span><span class="c">...</span></div>`;
    if (hk.aStart > 0 && a[hk.aStart - 1] != null) h += `<div class="dl"><span class="s"></span><span class="c">${hl(a[hk.aStart - 1], 'ts')}</span></div>`;
    a.slice(hk.aStart, hk.aStart + hk.aLen).forEach(l => { h += `<div class="dl d"><span class="s">-</span><span class="c">${hl(l, 'ts')}</span></div>`; });
    b.slice(hk.bStart, hk.bStart + hk.bLen).forEach(l => { h += `<div class="dl a"><span class="s">+</span><span class="c">${hl(l, 'ts')}</span></div>`; });
  });
  let add = 0, del = 0; hunks.forEach(x => { add += x.bLen; del += x.aLen; });

}

/* ---- compare (Mission Control version) ---- */
function mlnHtml(cls, n, code) { return `<div class="mln ${cls}"><span class="g">${n || ''}</span><span class="mk">${cls === 'add' ? '+' : cls === 'del' ? '-' : ''}</span><span class="cd">${hl(code, 'ts')}</span></div>`; }
function miniDiff(id, p) {
  const st = AFS[id] && AFS[id][p]; if (!st) return '';
  if (st.before === null) return st.after.split('\n').slice(0, 8).map((l, i) => mlnHtml('add', i + 1, l)).join('');
  const { a, b, hunks } = M.diff(st.before, st.after);
  if (!hunks.length) return `<div class="mgap">No differences</div>`;
  let out = '', shownTo = -1;
  hunks.forEach((h, k) => {
    const from = Math.max(h.bStart - 1, shownTo + 1);
    if (k > 0 && from > shownTo + 1) out += `<div class="mgap">...</div>`;
    for (let i = from; i < h.bStart; i++) out += mlnHtml('', i + 1, b[i]);
    for (let i = 0; i < h.aLen; i++) out += mlnHtml('del', h.aStart + i + 1, a[h.aStart + i]);
    for (let i = 0; i < h.bLen; i++) out += mlnHtml('add', h.bStart + i + 1, b[h.bStart + i]);
    const nb = h.bStart + h.bLen; if (nb < b.length - 1) { out += mlnHtml('', nb + 1, b[nb]); shownTo = nb; } else shownTo = nb - 1;
  });
  return out;
}

  e.stopPropagation(); fn(el, e);
});
document.addEventListener('change', e => { if (e.target.matches('select[data-model]')) { S.na.models[e.target.dataset.model] = e.target.value; } });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'palIn') { S.pal.q = t.value; S.pal.idx = 0; refreshPalList(); }
  else if (t.id === 'searchIn') { S.search = t.value; const r = searchResults(S.search); $('#searchRes').innerHTML = r.html; $('#searchMeta').textContent = r.meta; }
  else if (t.id === 'compIn') { S.drafts[S.dockAgent] = t.value; $('#sendBtn').classList.toggle('ready', !!t.value.trim()); }
  else if (t.id === 'commitIn') S.commitMsg = t.value;
  else if (t.id === 'taskIn') { S.na.task = t.value; t.classList.remove('bad'); }
});
document.addEventListener('keydown', e => {
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  const top = S.overlays[S.overlays.length - 1];
  if (k === 'Escape') {
    if (top) { e.preventDefault(); closeTop(); return; }
    if (S.switcherOpen) { S.switcherOpen = false; renderDock(); return; }
    return;
  }
  if (top && top.type === 'palette' && e.target.id === 'palIn') {
    const n = palItems().length;
    if (k === 'ArrowDown') { e.preventDefault(); S.pal.idx = (S.pal.idx + 1) % Math.max(1, n); refreshPalList(); return; }
    if (k === 'ArrowUp') { e.preventDefault(); S.pal.idx = (S.pal.idx - 1 + n) % Math.max(1, n); refreshPalList(); return; }
    if (k === 'Enter') { e.preventDefault(); runPal(S.pal.idx); return; }
  }
  if (top && top.type === 'newAgent' && ctrl && k === 'Enter') { e.preventDefault(); createAgent(); return; }
  if (e.target.id === 'compIn' && k === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); return; }
  if (ctrl && (k === ',' || e.code === 'Comma')) { e.preventDefault(); if (top && top.type === 'settings') closeTop(); else openSettings(); return; }
  if (ctrl && (k === 'k' || k === 'K') && !e.shiftKey) { e.preventDefault(); if (top && top.type === 'palette') closeTop(); else openPalette('cmd'); return; }
  if (ctrl && (k === 'p' || k === 'P') && !e.shiftKey) { e.preventDefault(); openPalette('file'); return; }
  if (ctrl && (k === 'n' || k === 'N') && !e.shiftKey) { e.preventDefault(); openNewAgent(); return; }
  if (ctrl && (k === '`' || e.code === 'Backquote')) { e.preventDefault(); toggleTerm(); return; }
  if (ctrl && e.shiftKey && (k === 'V' || k === 'v')) { e.preventDefault(); togglePreview(); return; }
  if (ctrl && e.shiftKey && (k === 'F' || k === 'f')) { e.preventDefault(); runCommand('Search in files'); return; }
  if (top) return;
  if (ctrl && k === 'Enter' && S.active && isChanged(S.active)) { e.preventDefault(); resolveFile(S.active, 'k'); return; }
});

renderAll();
window.__S = S;
})();
</script>
